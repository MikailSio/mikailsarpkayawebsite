<script>
const TERMS = [
  // ---- NLP ----
  {term:"Token", tr:"Token (kelime parçası)", cat:"NLP", def:"The atomic unit of text fed into a model — usually a subword piece (not a full word). Modern transformers tokenize text into 30k–50k subword vocabulary.", deftr:"Modele giren metin atomu — genellikle bir alt-kelime parçası. Modern transformer'lar metni 30k-50k alt-kelime sözlüğüne ayırır.", links:[["nlp/1","NLP L1"],["huggingface/2","HF L2"]]},
  {term:"Embedding", tr:"Gömme (vektör temsil)", cat:"NLP", def:"A dense vector that represents a token, sentence, or document such that semantically similar inputs land near each other in vector space.", deftr:"Bir token, cümle veya dokümanı temsil eden, anlamca benzer girdileri vektör uzayında birbirine yakınlaştıran yoğun vektör.", links:[["nlp/5","NLP L5"],["langchain/5","LangChain L5"]]},
  {term:"Attention", tr:"Dikkat", cat:"NLP", def:"A mechanism that lets a model weigh different parts of the input differently when producing an output — Q (query), K (key), V (value) matrix multiplication then softmax.", deftr:"Modelin çıktı üretirken girdinin farklı parçalarına farklı ağırlık vermesini sağlayan mekanizma — Q (sorgu), K (anahtar), V (değer) matrislerinin çarpımı + softmax.", links:[["nlp/10","NLP L10"],["pytorch/9","PyTorch L9"],["deep/9","Deep L9"]]},
  {term:"Transformer", tr:"Transformer", cat:"NLP", def:"The neural architecture that replaced RNNs in 2017. Stacks of self-attention + feed-forward blocks. Powers BERT, GPT, T5, and almost every modern LLM.", deftr:"2017'de RNN'leri yerinden eden sinir mimarisi. Self-attention + ileri beslemeli blokların yığını. BERT, GPT, T5 ve neredeyse tüm modern LLM'lerin temeli.", links:[["nlp/10","NLP L10"],["pytorch/9","PyTorch L9"]]},
  {term:"BERT", tr:"BERT", cat:"NLP", def:"Bidirectional Encoder Representations from Transformers — Google's 2018 encoder-only model. Pretrained with masked language modeling. Best for classification, NER, retrieval.", deftr:"Transformers'tan İki Yönlü Kodlayıcı Temsiller — Google'ın 2018 encoder-only modeli. Maskeli dil modellemesi ile önceden eğitilir. Sınıflandırma, NER, retrieval için ideal.", links:[["huggingface/3","HF L3"],["nlp/10","NLP L10"]]},
  {term:"GPT", tr:"GPT", cat:"NLP", def:"Generative Pretrained Transformer — OpenAI's decoder-only autoregressive language model family (GPT-2/3/4). Generates text token by token from left to right.", deftr:"Üretici Önceden Eğitilmiş Transformer — OpenAI'nin decoder-only otomatik regresif dil modeli ailesi (GPT-2/3/4). Metni soldan sağa token-token üretir.", links:[["nlp/11","NLP L11"]]},
  {term:"RAG", tr:"RAG (Erişim ile Üretim)", cat:"NLP", def:"Retrieval-Augmented Generation: search a vector store for relevant context, inject into the prompt, let the LLM answer with grounded knowledge. Reduces hallucination.", deftr:"Erişim-Destekli Üretim: vektör veri tabanından ilgili bağlamı bulup prompt'a ekleyerek LLM'in temelli bilgiyle cevap vermesini sağlar. Halüsinasyonu azaltır.", links:[["langchain/6","LangChain L6"],["langchain/10","LangChain L10"]]},
  {term:"Fine-tuning", tr:"İnce Ayar", cat:"NLP", def:"Continuing the training of a pretrained model on your specific task with a small labeled dataset — usually 1–5 epochs at a low learning rate.", deftr:"Önceden eğitilmiş bir modelin küçük etiketli veri kümesinde göreve özgü olarak eğitilmeye devam etmesi — genellikle 1-5 epoch, düşük öğrenme oranıyla.", links:[["huggingface/3","HF L3"],["pytorch/10","PyTorch L10"]]},
  {term:"BPE", tr:"BPE (Byte-Pair Encoding)", cat:"NLP", def:"Byte-Pair Encoding — a subword tokenization algorithm that iteratively merges the most frequent byte pairs. Used by GPT.", deftr:"İkili-Bayt Kodlama — en sık geçen bayt çiftlerini iteratif olarak birleştiren alt-kelime tokenleştirme algoritması. GPT tarafından kullanılır.", links:[["huggingface/2","HF L2"]]},
  {term:"Word2Vec", tr:"Word2Vec", cat:"NLP", def:"A 2013 algorithm that learns dense word vectors from co-occurrence in text. Famous for the analogy: king − man + woman ≈ queen.", deftr:"Metindeki birlikte geçişlerden yoğun kelime vektörleri öğrenen 2013 algoritması. Ünlü analoji: kral − erkek + kadın ≈ kraliçe.", links:[["nlp/5","NLP L5"]]},
  {term:"RLHF", tr:"RLHF", cat:"NLP", def:"Reinforcement Learning from Human Feedback — train a reward model from human preference pairs, then optimize the LLM with PPO under KL regularization. Used to align ChatGPT, Claude.", deftr:"İnsan Geri Bildirimi ile Pekiştirmeli Öğrenme — insan tercih çiftlerinden ödül modeli eğit, sonra LLM'i KL düzenlemesi altında PPO ile optimize et. ChatGPT, Claude'u hizalamak için kullanıldı.", links:[["rl/10","RL L10"]]},
  {term:"LoRA", tr:"LoRA", cat:"NLP", def:"Low-Rank Adaptation — fine-tune large models by injecting small low-rank matrices instead of updating all weights. ~1000× fewer parameters trained.", deftr:"Düşük-Sıralı Adaptasyon — tüm ağırlıkları güncellemek yerine küçük düşük-sıralı matrisler ekleyerek büyük modelleri ince ayar. ~1000× daha az parametre eğitilir.", links:[["nlp/11","NLP L11"]]},
  {term:"Prompt Engineering", tr:"Prompt Mühendisliği", cat:"NLP", def:"The craft of writing inputs to LLMs that reliably produce desired outputs — system messages, few-shot examples, chain-of-thought, output format constraints.", deftr:"LLM'lere istenen çıktıyı güvenilir şekilde ürettiren girdi yazma sanatı — sistem mesajları, few-shot örnekler, chain-of-thought, çıktı format kısıtları.", links:[["langchain/3","LangChain L3"]]},
  {term:"Hallucination", tr:"Halüsinasyon", cat:"NLP", def:"When an LLM confidently generates plausible-sounding but factually false content. Mitigated by RAG, citations, lower temperature, output verification.", deftr:"LLM'in inandırıcı ama olgusal yanlış içeriği güvenle üretmesi. RAG, alıntı, düşük sıcaklık, çıktı doğrulama ile azaltılır.", links:[["nlp/12","NLP L12"]]},
  {term:"Context Window", tr:"Bağlam Penceresi", cat:"NLP", def:"The maximum number of tokens an LLM can process in one call. GPT-3.5: 4k–16k, GPT-4: 8k–128k, Claude Sonnet 4.6: 1M tokens.", deftr:"Bir LLM'in tek çağrıda işleyebileceği maksimum token sayısı. GPT-3.5: 4k-16k, GPT-4: 8k-128k, Claude Sonnet 4.6: 1M token.", links:[["langchain/2","LangChain L2"]]},

  // ---- Agents ----
  {term:"Agent", tr:"Agent", cat:"Agents", def:"An LLM-driven system that observes, reasons, and acts on the world via tools. Beyond a single LLM call: maintains state, plans, and iterates until a goal is met.", deftr:"Bir LLM tarafından yönlendirilen sistem; tools aracılığıyla dünyayı gözlemler, akıl yürütür ve eylem yapar. Tek bir LLM çağrısının ötesinde: durum tutar, plan yapar ve hedef sağlanana kadar iterasyon yapar.", links:[["agents/1","Agents L1"]]},
  {term:"ReAct", tr:"ReAct", cat:"Agents", def:"Reasoning + Acting (Yao et al 2023). Agent loop alternating Thought (LLM reasoning), Action (tool call), Observation (tool result) until task completion.", deftr:"Reasoning + Acting (Yao ve diğ. 2023). Thought (LLM akıl yürütme), Action (tool çağrısı), Observation (tool sonucu) arasında dönüşümlü agent döngüsü, görev tamamlanana kadar.", links:[["agents/2","Agents L2"]]},
  {term:"Tool Calling", tr:"Tool Calling", cat:"Agents", def:"LLM API feature where the model returns a structured JSON request to invoke a function (Anthropic tool_use, OpenAI function_call). Runtime dispatches to actual code and returns result to model.", deftr:"LLM API özelliği — model bir fonksiyon çağrısı için yapılandırılmış JSON isteği döndürür (Anthropic tool_use, OpenAI function_call). Runtime gerçek koda dağıtır ve sonucu modele döndürür.", links:[["agents/3","Agents L3"]]},
  {term:"Function Calling", tr:"Function Calling", cat:"Agents", def:"OpenAI's term for tool calling — JSON-schema-based way for the model to request function invocations. Same idea as Anthropic tool_use.", deftr:"OpenAI'nin tool calling terimi — JSON-schema tabanlı modelin fonksiyon çağrısı isteme yolu. Anthropic tool_use ile aynı fikir.", links:[["agents/3","Agents L3"]]},
  {term:"LangGraph", tr:"LangGraph", cat:"Agents", def:"State-machine framework for agents (built on LangChain). Nodes are functions, edges are transitions (conditional or static), state is a typed dict. Enables checkpoints, persistence, time-travel.", deftr:"Agent'lar için durum-makinesi çerçevesi (LangChain üzerine). Düğümler fonksiyon, kenarlar geçiş (koşullu veya statik), durum tipli sözlük. Checkpoint, kalıcılık, zaman-yolculuğu sağlar.", links:[["agents/5","Agents L5"]]},
  {term:"Plan-and-Execute", tr:"Plan-and-Execute", cat:"Agents", def:"Agent pattern: first LLM produces an explicit multi-step plan, then a worker executes each step. Better for complex multi-stage tasks than pure ReAct.", deftr:"Agent kalıbı: önce LLM açık çok-adımlı bir plan üretir, ardından bir worker her adımı yürütür. Karmaşık çok-aşamalı görevler için saf ReAct'ten daha iyi.", links:[["agents/7","Agents L7"]]},
  {term:"Tree of Thoughts", tr:"Tree of Thoughts (ToT)", cat:"Agents", def:"Yao et al 2023. Instead of one chain of thought, explore a tree of partial reasoning paths, evaluate each, prune worst, expand best. Beats CoT on hard reasoning benchmarks.", deftr:"Yao ve diğ. 2023. Tek bir düşünce zinciri yerine, kısmi akıl yürütme yollarından oluşan bir ağaç keşfet, her birini değerlendir, en kötüyü buda, en iyiyi genişlet. Zor akıl yürütme benchmark'larında CoT'u geçer.", links:[["agents/7","Agents L7"]]},
  {term:"ReWOO", tr:"ReWOO", cat:"Agents", def:"Reasoning WithOut Observation (Xu et al 2023). Plan all tool calls upfront, execute in parallel, then synthesize. Reduces LLM round-trips vs ReAct (cheaper, faster).", deftr:"Reasoning WithOut Observation (Xu ve diğ. 2023). Tüm tool çağrılarını önceden planla, paralel yürüt, sonra sentezle. ReAct'a göre LLM gidip-gelmesini azaltır (daha ucuz, daha hızlı).", links:[["agents/7","Agents L7"]]},
  {term:"AutoGen", tr:"AutoGen", cat:"Agents", def:"Microsoft Research's multi-agent framework. Conversational agents (UserProxyAgent, AssistantAgent) talk to each other in group chat to solve tasks collaboratively.", deftr:"Microsoft Research'ün multi-agent çerçevesi. Konuşmacı agent'lar (UserProxyAgent, AssistantAgent) görevleri işbirliğiyle çözmek için grup sohbetinde birbirleriyle konuşur.", links:[["agents/8","Agents L8"]]},
  {term:"CrewAI", tr:"CrewAI", cat:"Agents", def:"Multi-agent framework with role-based agents (Researcher, Writer, Reviewer). Each agent has a goal, backstory, tools. Orchestrated by a Crew with sequential or hierarchical process.", deftr:"Rol-tabanlı agent'larla multi-agent çerçevesi (Researcher, Writer, Reviewer). Her agent'ın hedefi, arka planı, tool'ları var. Sıralı veya hiyerarşik süreçle Crew tarafından düzenlenir.", links:[["agents/8","Agents L8"]]},
  {term:"Computer Use", tr:"Computer Use", cat:"Agents", def:"Anthropic's Oct 2024 API: Claude can take screenshots and emit click/type/key actions to control a computer. Enables browser/desktop automation agents.", deftr:"Anthropic'in Ekim 2024 API'si: Claude ekran görüntüsü alabilir ve bilgisayarı kontrol etmek için tıkla/yaz/tuş eylemleri yayabilir. Browser/desktop otomasyon agent'larını mümkün kılar.", links:[["agents/9","Agents L9"]]},
  {term:"Multi-Agent System", tr:"Multi-Agent Sistem (MAS)", cat:"Agents", def:"Architecture where multiple agents (often with different roles, models, or tools) collaborate, debate, or compete to solve a task. Examples: AutoGen group chat, CrewAI roles, LangGraph supervisor.", deftr:"Birden çok agent'ın (genellikle farklı rol, model veya tool ile) bir görevi çözmek için işbirliği yaptığı, tartıştığı veya rekabet ettiği mimari. Örnekler: AutoGen grup sohbeti, CrewAI rolleri, LangGraph denetleyicisi.", links:[["agents/8","Agents L8"]]},
  {term:"Scratchpad Memory", tr:"Scratchpad Bellek", cat:"Agents", def:"Short-term in-context memory: agent's reasoning trace (Thought/Action/Observation history) appended to the prompt for the next turn.", deftr:"Kısa vadeli bağlam-içi bellek: agent'ın akıl yürütme izi (Thought/Action/Observation geçmişi) sonraki tur için prompt'a eklenir.", links:[["agents/6","Agents L6"]]},
  {term:"Vector Memory", tr:"Vektör Bellek", cat:"Agents", def:"Long-term memory: past interactions embedded as vectors and retrieved by semantic similarity at query time. Survives context window limits.", deftr:"Uzun vadeli bellek: geçmiş etkileşimler vektör olarak gömülür ve sorgu anında anlamsal benzerlikle alınır. Bağlam penceresi limitlerini aşar.", links:[["agents/6","Agents L6"]]},
  {term:"LangSmith", tr:"LangSmith", cat:"Agents", def:"LangChain's observability platform. Traces every span (LLM call, tool, retriever) of an agent run with metadata, cost, latency. Critical for debugging and eval.", deftr:"LangChain'in gözlemlenebilirlik platformu. Bir agent çalışmasının her span'ini (LLM çağrısı, tool, retriever) metadata, maliyet, gecikme ile izler. Hata ayıklama ve değerlendirme için kritik.", links:[["agents/11","Agents L11"]]},
  {term:"Trajectory", tr:"Trajektör", cat:"Agents", def:"The full sequence of (state, action, observation) tuples an agent produces while solving a task. Evaluated for quality beyond just final answer.", deftr:"Bir agent'ın görev çözerken ürettiği tam (durum, eylem, gözlem) üçlü dizisi. Sadece son cevabın ötesinde kalite için değerlendirilir.", links:[["agents/10","Agents L10"]]},
  {term:"GAIA", tr:"GAIA Benchmark", cat:"Agents", def:"General AI Assistants benchmark (Mialon et al 2023). 466 multi-step tasks requiring web browsing, file reading, math. Humans 92%, GPT-4 + plugins 30%.", deftr:"Genel AI Asistanları benchmark'ı (Mialon ve diğ. 2023). Web tarama, dosya okuma, matematik gerektiren 466 çok-adımlı görev. İnsan %92, GPT-4 + eklentiler %30.", links:[["agents/10","Agents L10"]]},
  {term:"AgentBench", tr:"AgentBench", cat:"Agents", def:"Liu et al 2023 multi-domain agent eval: code, web, OS, DB, knowledge graph. Reveals huge gap between API agents and open-source on complex tasks.", deftr:"Liu ve diğ. 2023 çok-alanlı agent değerlendirmesi: kod, web, işletim sistemi, veritabanı, bilgi grafı. API agent'ları ile açık kaynak arasında karmaşık görevlerde büyük açık ortaya koyar.", links:[["agents/10","Agents L10"]]},
  {term:"HITL", tr:"HITL (İnsan-Döngüde)", cat:"Agents", def:"Human-in-the-Loop: agent pauses at high-risk steps (DB write, email send, payment) and asks a human to approve. Standard production pattern.", deftr:"İnsan-Döngüde: agent yüksek-riskli adımlarda (DB yazma, email gönderme, ödeme) duraklayıp bir insandan onay ister. Standart üretim kalıbı.", links:[["agents/11","Agents L11"]]},
  {term:"LLM-as-Judge", tr:"LLM-as-Judge", cat:"Agents", def:"Use a strong LLM (GPT-4, Claude Opus) to grade another model's output on quality dimensions (helpfulness, accuracy, faithfulness). Scales eval but introduces judge bias.", deftr:"Bir başka modelin çıktısını kalite boyutlarında (yardımseverlik, doğruluk, sadakat) notlamak için güçlü bir LLM (GPT-4, Claude Opus) kullan. Değerlendirmeyi ölçeklendirir ama yargıç önyargısı getirir.", links:[["agents/10","Agents L10"]]},

  // ---- Vector DB ----
  {term:"Vector Database", tr:"Vector Veritabanı", cat:"VectorDB", def:"A specialized database optimized for storing and querying high-dimensional vectors via approximate nearest neighbor (ANN) search. Powers RAG, semantic search, recommender systems.", deftr:"Yüksek-boyutlu vektörleri yaklaşık en yakın komşu (ANN) araması ile depolamak ve sorgulamak için optimize edilmiş özelleşmiş veritabanı. RAG, anlamsal arama, öneri sistemlerinin temeli.", links:[["vectordb/1","VectorDB L1"]]},
  {term:"FAISS", tr:"FAISS", cat:"VectorDB", def:"Facebook AI Similarity Search — open-source library for efficient vector search. Supports IndexFlat (exact), IVF (inverted file), HNSW (graph), PQ (product quantization), GPU.", deftr:"Facebook AI Similarity Search — verimli vektör araması için açık kaynak kütüphane. IndexFlat (kesin), IVF (ters dosya), HNSW (graf), PQ (ürün quantization), GPU desteği.", links:[["vectordb/2","VectorDB L2"]]},
  {term:"HNSW", tr:"HNSW", cat:"VectorDB", def:"Hierarchical Navigable Small World — graph-based ANN algorithm. Multi-layer skip-list-like structure, O(log N) search. Default index in most modern vector DBs (Qdrant, Weaviate, pgvector).", deftr:"Hierarchical Navigable Small World — graf-tabanlı ANN algoritması. Çok katmanlı skip-list benzeri yapı, O(log N) arama. Çoğu modern vector DB'de varsayılan indeks (Qdrant, Weaviate, pgvector).", links:[["vectordb/3","VectorDB L3"]]},
  {term:"ANN Search", tr:"ANN Araması", cat:"VectorDB", def:"Approximate Nearest Neighbor — sacrifices exact correctness for huge speedups (100-1000×). Recall@k metric measures quality. Standard for billion-scale vector search.", deftr:"Approximate Nearest Neighbor — büyük hız artışı (100-1000×) için kesin doğruluğu feda eder. Recall@k metriği kaliteyi ölçer. Milyar ölçekli vektör araması için standart.", links:[["vectordb/3","VectorDB L3"]]},
  {term:"IVF Index", tr:"IVF İndeks", cat:"VectorDB", def:"Inverted File index — partitions vectors into Voronoi cells via k-means. Search visits only the closest n_probe cells. Trades recall for speed via n_probe knob.", deftr:"Inverted File indeksi — k-means ile vektörleri Voronoi hücrelerine böler. Arama sadece en yakın n_probe hücreyi ziyaret eder. n_probe ayarıyla recall-hız dengesi.", links:[["vectordb/2","VectorDB L2"]]},
  {term:"Product Quantization", tr:"Product Quantization (PQ)", cat:"VectorDB", def:"Compress D-dim vector into M sub-vectors, each replaced by 8-bit codebook index. 32× compression typical. Combined with IVF for billion-scale (IVF-PQ).", deftr:"D-boyutlu vektörü M alt-vektöre böl, her biri 8-bit codebook indeksiyle değiştir. Tipik 32× sıkıştırma. Milyar ölçek için IVF ile birleştirilir (IVF-PQ).", links:[["vectordb/3","VectorDB L3"]]},
  {term:"Pinecone", tr:"Pinecone", cat:"VectorDB", def:"Fully managed serverless vector DB. Pay-per-vector pricing. Strong on simplicity (no infra), weaker on advanced query (limited filtering, no hybrid).", deftr:"Tamamen yönetilen serverless vector DB. Vektör başına ücretlendirme. Basitlikte güçlü (altyapı yok), gelişmiş sorguda zayıf (sınırlı filtre, hibrit yok).", links:[["vectordb/4","VectorDB L4"]]},
  {term:"Weaviate", tr:"Weaviate", cat:"VectorDB", def:"Open-source vector DB with built-in modules for embedding (transformers, OpenAI), GraphQL API, hybrid search, multi-tenancy. Self-hostable or cloud.", deftr:"Gömme (transformers, OpenAI), GraphQL API, hibrit arama, multi-tenancy için yerleşik modüllere sahip açık kaynak vector DB. Self-host veya bulut.", links:[["vectordb/4","VectorDB L4"]]},
  {term:"Qdrant", tr:"Qdrant", cat:"VectorDB", def:"Rust-based open-source vector DB. Strong filtering (payload-based), HNSW with quantization, gRPC + REST. Popular for production RAG.", deftr:"Rust tabanlı açık kaynak vector DB. Güçlü filtreleme (payload-tabanlı), quantization ile HNSW, gRPC + REST. Üretim RAG'ı için popüler.", links:[["vectordb/4","VectorDB L4"]]},
  {term:"pgvector", tr:"pgvector", cat:"VectorDB", def:"PostgreSQL extension adding vector type + HNSW/IVFFlat indexes. Use when you already run Postgres — keeps vectors near relational data, simplifies ops.", deftr:"PostgreSQL eklentisi — vektör tipi + HNSW/IVFFlat indeksleri ekler. Zaten Postgres çalıştırıyorsanız kullanın — vektörleri ilişkisel verinin yanında tutar, ops'u sadeleştirir.", links:[["vectordb/4","VectorDB L4"]]},
  {term:"Hybrid Search", tr:"Hibrit Arama", cat:"VectorDB", def:"Combine sparse (BM25 keyword) + dense (vector semantic) retrieval and merge results. Catches both exact-keyword and semantic-similar matches. RRF or weighted-sum fusion.", deftr:"Sparse (BM25 anahtar kelime) + dense (vektör anlamsal) erişimi birleştir ve sonuçları birleştir. Hem tam-kelime hem anlamsal-benzer eşleşmeleri yakalar. RRF veya ağırlıklı toplam füzyon.", links:[["vectordb/5","VectorDB L5"]]},
  {term:"Reranker", tr:"Reranker", cat:"VectorDB", def:"Cross-encoder model that re-scores top-K retrieved docs by joint-attention over (query, doc) pairs. Adds 50-200ms but boosts recall by 10-30%. BGE, Cohere, Jina.", deftr:"Cross-encoder modeli — ilk-K alınan dokümanları (sorgu, doküman) çiftleri üzerinde ortak-dikkat ile yeniden puanlar. 50-200ms ekler ama recall'u %10-30 artırır. BGE, Cohere, Jina.", links:[["vectordb/5","VectorDB L5"]]},
  {term:"RRF", tr:"RRF (Karşılıklı Sıra Füzyonu)", cat:"VectorDB", def:"Reciprocal Rank Fusion — simple yet strong technique to merge ranked lists from multiple retrievers. score(d) = Σ 1/(k + rank_i(d)), k=60 typical.", deftr:"Reciprocal Rank Fusion — birden çok retriever'dan sıralanmış listeleri birleştirmek için basit ama güçlü teknik. score(d) = Σ 1/(k + rank_i(d)), tipik k=60.", links:[["vectordb/5","VectorDB L5"]]},
  {term:"ColBERT", tr:"ColBERT", cat:"VectorDB", def:"Late-interaction retrieval — store one vector per token (not one per doc), score by max-sim over query tokens. Higher recall than single-vector at higher storage cost.", deftr:"Geç-etkileşim erişimi — token başına bir vektör sakla (doküman başına değil), sorgu token'ları üzerinden max-sim ile puanla. Tek-vektörden daha yüksek recall, daha yüksek depolama maliyeti.", links:[["vectordb/5","VectorDB L5"]]},
  {term:"Recall@k", tr:"Recall@k", cat:"VectorDB", def:"Fraction of true nearest neighbors found in top-k retrieved results. Standard ANN quality metric. Production RAG targets recall@10 ≥ 0.9 typically.", deftr:"İlk-k alınan sonuçlarda bulunan gerçek en yakın komşuların oranı. Standart ANN kalite metriği. Üretim RAG tipik olarak recall@10 ≥ 0.9 hedefler.", links:[["vectordb/3","VectorDB L3"]]},

  // ---- Time Series ----
  {term:"Stationarity", tr:"Durağanlık", cat:"TimeSeries", def:"A time series whose statistical properties (mean, variance, autocorrelation) don't change over time. Required for ARIMA. Test with ADF or KPSS.", deftr:"İstatistiksel özellikleri (ortalama, varyans, otokorelasyon) zamanla değişmeyen zaman serisi. ARIMA için gerekli. ADF veya KPSS ile test et.", links:[["timeseries/1","TS L1"]]},
  {term:"ARIMA", tr:"ARIMA", cat:"TimeSeries", def:"AutoRegressive Integrated Moving Average — classical statistical forecaster. Parameters (p,d,q) for AR order, differencing, MA order. SARIMA adds seasonal terms.", deftr:"Otoregresif Entegre Hareketli Ortalama — klasik istatistiksel tahminci. AR derecesi, fark alma, MA derecesi için (p,d,q) parametreleri. SARIMA mevsimsel terim ekler.", links:[["timeseries/2","TS L2"]]},
  {term:"Prophet", tr:"Prophet", cat:"TimeSeries", def:"Facebook's open-source forecaster. Decomposes trend + seasonality + holidays. Robust to missing data and changepoints. Great for business metrics with weekly/yearly seasonality.", deftr:"Facebook'un açık kaynak tahmincisi. Trend + mevsim + tatilleri ayrıştırır. Eksik veriye ve değişim noktalarına dayanıklı. Haftalık/yıllık mevsimselliğe sahip iş metrikleri için harika.", links:[["timeseries/3","TS L3"]]},
  {term:"N-BEATS", tr:"N-BEATS", cat:"TimeSeries", def:"Neural Basis Expansion Analysis (Oreshkin 2019). Pure deep learning forecaster using interpretable trend+seasonality basis blocks. SOTA on M4 competition.", deftr:"Sinir Bazlı Genişleme Analizi (Oreshkin 2019). Yorumlanabilir trend+mevsim baz bloklarıyla saf derin öğrenme tahmincisi. M4 yarışmasında SOTA.", links:[["timeseries/7","TS L7"]]},
  {term:"TFT", tr:"TFT (Temporal Fusion Transformer)", cat:"TimeSeries", def:"Lim et al 2021. Attention-based forecaster combining LSTM encoder + interpretable multi-head attention + variable selection networks. Strong on multi-horizon multivariate.", deftr:"Lim ve diğ. 2021. LSTM kodlayıcı + yorumlanabilir multi-head dikkat + değişken seçim ağlarını birleştiren attention-tabanlı tahminci. Çok-ufuk çok-değişkenli üzerinde güçlü.", links:[["timeseries/8","TS L8"]]},
  {term:"Conformal Prediction", tr:"Conformal Tahmin", cat:"TimeSeries", def:"Distribution-free framework producing valid prediction intervals with guaranteed coverage. Wraps any forecaster. Works with neural nets, ARIMA, gradient boosting alike.", deftr:"Garantili kapsama ile geçerli tahmin aralıkları üreten dağılım-bağımsız çerçeve. Herhangi bir tahminciyi sarar. Sinir ağları, ARIMA, gradient boosting ile çalışır.", links:[["timeseries/9","TS L9"]]},

  // ---- Graph Neural Networks ----
  {term:"GCN", tr:"GCN", cat:"GNN", def:"Graph Convolutional Network (Kipf & Welling 2017). Aggregates features from neighbors via H^{l+1} = σ(D̂^{-1/2} Â D̂^{-1/2} H^l W^l). Foundation of message passing.", deftr:"Graf Konvolüsyon Ağı (Kipf & Welling 2017). Komşulardan özellikleri H^{l+1} = σ(D̂^{-1/2} Â D̂^{-1/2} H^l W^l) ile toplar. Mesaj geçişinin temeli.", links:[["gnn/4","GNN L4"]]},
  {term:"GAT", tr:"GAT", cat:"GNN", def:"Graph Attention Network (Veličković 2018). Learns attention coefficients α_ij over edges; each node weights neighbors differently. Multi-head for stability.", deftr:"Graf Dikkat Ağı (Veličković 2018). Kenarlar üzerinde dikkat katsayıları α_ij öğrenir; her düğüm komşulara farklı ağırlık verir. Stabilite için multi-head.", links:[["gnn/5","GNN L5"]]},
  {term:"Message Passing", tr:"Mesaj Geçişi", cat:"GNN", def:"General GNN framework: each layer aggregates messages from neighbors, then updates node representation. PyG MessagePassing class implements this.", deftr:"Genel GNN çerçevesi: her katman komşulardan mesaj toplar, sonra düğüm temsilini günceller. PyG MessagePassing sınıfı bunu uygular.", links:[["gnn/4","GNN L4"]]},
  {term:"Node2Vec", tr:"Node2Vec", cat:"GNN", def:"Grover & Leskovec 2016. Learn node embeddings via biased random walks + skip-gram. Captures both local (BFS-like) and global (DFS-like) structure.", deftr:"Grover & Leskovec 2016. Önyargılı rastgele yürüyüşler + skip-gram ile düğüm gömmeleri öğren. Hem yerel (BFS-benzeri) hem küresel (DFS-benzeri) yapıyı yakalar.", links:[["gnn/2","GNN L2"]]},
  {term:"PyTorch Geometric", tr:"PyTorch Geometric", cat:"GNN", def:"PyG — leading PyTorch GNN library. Data/Batch classes, MessagePassing API, 50+ benchmark datasets, ~30 GNN models pre-implemented.", deftr:"PyG — önde gelen PyTorch GNN kütüphanesi. Data/Batch sınıfları, MessagePassing API, 50+ benchmark dataset, ~30 GNN modeli önceden uygulanmış.", links:[["gnn/6","GNN L6"]]},
  {term:"PageRank", tr:"PageRank", cat:"GNN", def:"Brin & Page 1998. Iterative graph centrality: PR(v) = (1-d)/N + d Σ PR(u)/L(u). Foundation of Google search; used as GNN baseline.", deftr:"Brin & Page 1998. İteratif graf merkeziliği: PR(v) = (1-d)/N + d Σ PR(u)/L(u). Google aramasının temeli; GNN baseline olarak kullanılır.", links:[["gnn/2","GNN L2"]]},

  // ---- Recommender Systems ----
  {term:"Matrix Factorization", tr:"Matris Çarpanlama", cat:"RecSys", def:"User-item rating matrix R ≈ U V^T where U is user latent factors, V is item factors. Trained with SGD or ALS. Foundation of Netflix Prize era recommenders.", deftr:"Kullanıcı-öğe rating matrisi R ≈ U V^T, U kullanıcı gizli faktörleri, V öğe faktörleri. SGD veya ALS ile eğitilir. Netflix Ödülü dönemi öneri sistemlerinin temeli.", links:[["recsys/2","RecSys L2"]]},
  {term:"BPR", tr:"BPR", cat:"RecSys", def:"Bayesian Personalized Ranking (Rendle 2009). For implicit feedback: maximize σ(score_pos − score_neg) over (user, positive, negative) triples sampled from clicks.", deftr:"Bayesian Kişiselleştirilmiş Sıralama (Rendle 2009). Örtük geri bildirim için: tıklamalardan örneklenen (kullanıcı, pozitif, negatif) üçlüleri üzerinden σ(score_pos − score_neg) maksimize et.", links:[["recsys/3","RecSys L3"]]},
  {term:"Two-Tower Model", tr:"Two-Tower Model", cat:"RecSys", def:"Separate user and item encoders → embedding spaces. Inference is fast nearest-neighbor lookup. Used by YouTube, TikTok, Pinterest at scale.", deftr:"Ayrı kullanıcı ve öğe kodlayıcılar → gömme uzayları. Çıkarım hızlı en-yakın-komşu aramasıdır. YouTube, TikTok, Pinterest tarafından ölçekte kullanılır.", links:[["recsys/4","RecSys L4"]]},
  {term:"NCF", tr:"NCF", cat:"RecSys", def:"Neural Collaborative Filtering (He et al 2017). Replace dot product with MLP — generalize matrix factorization. Often combined with Generalized Matrix Factorization (GMF).", deftr:"Sinir İşbirlikçi Filtreleme (He ve diğ. 2017). İç çarpımı MLP ile değiştir — matris çarpanlamayı genelle. Genellikle Generalized Matrix Factorization (GMF) ile birleştirilir.", links:[["recsys/5","RecSys L5"]]},
  {term:"SASRec", tr:"SASRec", cat:"RecSys", def:"Self-Attentive Sequential Recommendation (Kang & McAuley 2018). Transformer over user's interaction history. Predicts next item. SOTA-class on session benchmarks.", deftr:"Öz-Dikkatli Sıralı Öneri (Kang & McAuley 2018). Kullanıcının etkileşim geçmişi üzerinde transformer. Sonraki öğeyi tahmin eder. Oturum benchmark'larında SOTA-sınıfı.", links:[["recsys/6","RecSys L6"]]},
  {term:"Bandits (RecSys)", tr:"Bandit (Öneri Sistemleri)", cat:"RecSys", def:"Multi-armed bandit framing: each item is an arm, click is reward. Use UCB/Thompson/LinUCB for exploration vs exploitation in cold-start and ranking.", deftr:"Çok-kollu bandit çerçeveleme: her öğe bir kol, tıklama ödül. Soğuk-başlangıç ve sıralamada keşif vs sömürü için UCB/Thompson/LinUCB kullan.", links:[["recsys/7","RecSys L7"]]},

  // ---- Safety / Alignment ----
  {term:"RLHF", tr:"RLHF (İnsan Geri Bildirimi RL)", cat:"Safety", def:"Reinforcement Learning from Human Feedback. 3-stage: SFT → reward model from preferences → PPO with KL penalty. Aligned ChatGPT, Claude, Gemini.", deftr:"İnsan Geri Bildiriminden Pekiştirmeli Öğrenme. 3 aşama: SFT → tercihlerden ödül modeli → KL ceza ile PPO. ChatGPT, Claude, Gemini'yi hizaladı.", links:[["safety/2","Safety L2"]]},
  {term:"DPO", tr:"DPO", cat:"Safety", def:"Direct Preference Optimization (Rafailov 2023). Skips reward model — directly optimizes log-likelihood ratio of preferred vs rejected. Simpler, stable, comparable to PPO.", deftr:"Doğrudan Tercih Optimizasyonu (Rafailov 2023). Ödül modelini atlar — tercih edilenin reddedilene log-olasılık oranını doğrudan optimize eder. Daha basit, stabil, PPO ile karşılaştırılabilir.", links:[["safety/3","Safety L3"]]},
  {term:"Constitutional AI", tr:"Anayasal AI", cat:"Safety", def:"Anthropic 2022. Use a written constitution (principles) to make the model self-critique and revise. Then RLAIF (RL from AI feedback) — no humans needed in the loop.", deftr:"Anthropic 2022. Modelin kendini eleştirmesi ve revize etmesi için yazılı bir anayasa (ilkeler) kullan. Sonra RLAIF (AI geri bildiriminden RL) — döngüde insan gerekmez.", links:[["safety/4","Safety L4"]]},
  {term:"Red Teaming", tr:"Red Team", cat:"Safety", def:"Adversarial testing: humans + automated attackers try to elicit harmful outputs. GCG (gradient-based adversarial suffixes), PAIR (LLM-generated jailbreaks), curated harm taxonomies.", deftr:"Karşıtsal test: insanlar + otomatik saldırganlar zararlı çıktı çekmeye çalışır. GCG (gradient-tabanlı karşıtsal sonekler), PAIR (LLM-üretilen jailbreak), küratörlü zarar sınıflandırmaları.", links:[["safety/5","Safety L5"]]},
  {term:"Jailbreak", tr:"Jailbreak", cat:"Safety", def:"Prompts that bypass model safety training to elicit refused content. DAN, role-play, hypothetical, encoding attacks, multi-turn social engineering. Defense: refusal training + guardrails.", deftr:"Modelin güvenlik eğitimini atlatıp reddettiği içeriği çekmek için prompt'lar. DAN, rol oyunu, varsayımsal, kodlama saldırıları, çok-turlu sosyal mühendislik. Savunma: reddetme eğitimi + guardrail.", links:[["safety/5","Safety L5"]]},
  {term:"HELM", tr:"HELM", cat:"Safety", def:"Holistic Evaluation of Language Models (Stanford 2022). 7 metrics × 16 scenarios × 30+ models. Public leaderboard. Standard for comprehensive LLM eval.", deftr:"Dil Modellerinin Bütünsel Değerlendirilmesi (Stanford 2022). 7 metrik × 16 senaryo × 30+ model. Halka açık liderlik tablosu. Kapsamlı LLM değerlendirme standardı.", links:[["safety/6","Safety L6"]]},

  // ---- HF expansion ----
  {term:"PEFT", tr:"PEFT", cat:"NLP", def:"Parameter-Efficient Fine-Tuning. Train only ~1% of weights via LoRA, QLoRA, Adapter, IA³. ~1000× cheaper than full fine-tune. Multiple adapters per base model.", deftr:"Parametre-Verimli İnce Ayar. LoRA, QLoRA, Adapter, IA³ ile ağırlıkların sadece ~%1'ini eğit. Tam ince ayardan ~1000× daha ucuz. Bir taban model başına birden çok adapter.", links:[["huggingface/8","HF L8"]]},
  {term:"vLLM", tr:"vLLM", cat:"NLP", def:"Production LLM server (Berkeley 2023). PagedAttention for KV cache, continuous batching, speculative decoding. ~10× throughput vs naive generation.", deftr:"Üretim LLM sunucusu (Berkeley 2023). KV cache için PagedAttention, sürekli batching, spekülatif kod çözme. Naif üretime göre ~10× throughput.", links:[["huggingface/9","HF L9"]]},
  {term:"PagedAttention", tr:"PagedAttention", cat:"NLP", def:"vLLM's memory technique. Treats KV cache like virtual memory pages. Eliminates fragmentation, enables 4× more concurrent requests on the same GPU.", deftr:"vLLM'in bellek tekniği. KV cache'i sanal bellek sayfaları gibi ele alır. Parçalanmayı yok eder, aynı GPU'da 4× daha fazla eşzamanlı istek sağlar.", links:[["huggingface/9","HF L9"]]},

  // ---- GPU / CUDA ----
  {term:"CUDA", tr:"CUDA", cat:"GPU", def:"NVIDIA's C-like programming model for GPUs. Kernels run as grids of thread blocks. The substrate beneath PyTorch/TensorFlow GPU code. cuBLAS, cuDNN, NCCL form the standard library.", deftr:"NVIDIA'nın GPU'lar için C-benzeri programlama modeli. Kernel'lar thread block grid'leri olarak çalışır. PyTorch/TensorFlow GPU kodunun altındaki substrat.", links:[["gpu/2","GPU L2"]]},
  {term:"Warp", tr:"Warp", cat:"GPU", def:"Group of 32 threads that execute in lockstep on NVIDIA GPUs. SIMT (Single Instruction Multiple Threads). Branch divergence within a warp serializes execution.", deftr:"NVIDIA GPU'larda kilitli adımda yürüyen 32 thread'lik grup. SIMT (Tek Talimat Çoklu Thread). Warp içinde dal sapması yürütmeyi serileştirir.", links:[["gpu/1","GPU L1"]]},
  {term:"Triton", tr:"Triton", cat:"GPU", def:"OpenAI's Python DSL for GPU kernels (2021). Block-level abstraction, auto-tuning, IO-aware scheduling. Used to write FlashAttention, vLLM kernels.", deftr:"OpenAI'ın GPU kernel'ları için Python DSL'i (2021). Blok-seviye soyutlama, otomatik ayarlama, IO-uyumlu zamanlama. FlashAttention, vLLM kernel'ları yazmak için kullanılır.", links:[["gpu/5","GPU L5"]]},
  {term:"FlashAttention", tr:"FlashAttention", cat:"GPU", def:"Dao 2022. IO-aware attention: tile QK matmul in SRAM, online softmax, never materialize the full attention matrix. 2-4× speedup, no accuracy loss.", deftr:"Dao 2022. IO-uyumlu attention: SRAM'de QK matmul karoları, çevrimiçi softmax, tam attention matrisini asla maddileştirme. 2-4× hızlanma, doğruluk kaybı yok.", links:[["gpu/6","GPU L6"]]},
  {term:"FSDP", tr:"FSDP", cat:"GPU", def:"Fully Sharded Data Parallel — PyTorch's ZeRO-3-equivalent. Shards model parameters, gradients, and optimizer states across GPUs. Train 100B+ models on 8 H100s.", deftr:"Tamamen Parçalanmış Veri Paralel — PyTorch'un ZeRO-3 eşdeğeri. Model parametreleri, gradient'lar ve optimizer durumlarını GPU'lar arasında parçalar. 8 H100'de 100B+ model eğit.", links:[["gpu/7","GPU L7"]]},

  // ---- Multimodal ----
  {term:"LLaVA", tr:"LLaVA", cat:"Multimodal", def:"Large Language and Vision Assistant (Liu 2023). CLIP vision encoder + Vicuna LLM via projection layer. First widely-used open vision-language model, instruction-tuned on 158K samples.", deftr:"Büyük Dil ve Görü Asistanı (Liu 2023). CLIP görü encoder + Vicuna LLM, projeksiyon katmanı ile. İlk yaygın kullanılan açık görü-dil modeli, 158K örneğe talimat-ayarlı.", links:[["multimodal/3","Multimodal L3"]]},
  {term:"BLIP-2", tr:"BLIP-2", cat:"Multimodal", def:"Salesforce 2023. Q-Former bridges frozen vision encoder + frozen LLM. Trains only the Q-Former (~100M params), enabling capability transfer at low cost.", deftr:"Salesforce 2023. Q-Former donmuş görü encoder + donmuş LLM'i köprüler. Sadece Q-Former'i eğitir (~100M param), düşük maliyetle yetenek transferi.", links:[["multimodal/3","Multimodal L3"]]},
  {term:"Q-Former", tr:"Q-Former", cat:"Multimodal", def:"Querying Transformer (BLIP-2). Learnable query tokens cross-attend to visual features, output passed to LLM. Enables modality bridging without fine-tuning huge models.", deftr:"Sorgu Transformer'ı (BLIP-2). Öğrenilebilir sorgu token'ları görsel özelliklere cross-attend yapar, çıktı LLM'e geçer. Büyük modelleri ince-ayar yapmadan modalite köprüleme.", links:[["multimodal/3","Multimodal L3"]]},
  {term:"Sora", tr:"Sora", cat:"Multimodal", def:"OpenAI 2024. Diffusion transformer over spacetime patches → photorealistic video up to 60 sec. Trained on patches like LLM trains on tokens. Successor: Veo 2 (Google), Runway Gen-3.", deftr:"OpenAI 2024. Uzay-zaman yamaları üzerinde difüzyon transformer'ı → 60 saniyeye kadar fotogerçekçi video. LLM'in token üzerinde eğitildiği gibi yamalar üzerinde eğitilir. Halefler: Veo 2 (Google), Runway Gen-3.", links:[["multimodal/7","Multimodal L7"]]},

  // ---- Causal Inference ----
  {term:"do-Calculus", tr:"do-Hesabı", cat:"Causal", def:"Pearl's 3-rule symbolic system to convert P(Y | do(X)) (interventional) into P(Y | X, …) (observational) when identifiable. Foundation of modern causal inference.", deftr:"Pearl'ın 3-kurallı sembolik sistemi: tanımlanabilir olduğunda P(Y | do(X)) (müdahaleli) → P(Y | X, …) (gözlemsel). Modern nedensel çıkarımın temeli.", links:[["causal/3","Causal L3"]]},
  {term:"ATE", tr:"ATE (Ortalama Tedavi Etkisi)", cat:"Causal", def:"Average Treatment Effect: E[Y(1) − Y(0)]. Expected difference if everyone got treatment vs control. Estimated via RCT, IPW, doubly robust, causal forests.", deftr:"Ortalama Tedavi Etkisi: E[Y(1) − Y(0)]. Herkes tedavi vs kontrol alsaydı beklenen fark. RCT, IPW, çift sağlam, nedensel ormanlar ile tahmin edilir.", links:[["causal/4","Causal L4"]]},
  {term:"Propensity Score", tr:"Eğilim Skoru", cat:"Causal", def:"P(Treatment=1 | X). Estimated via LogReg or any classifier. Used in IPW (inverse-propensity weighting) and matching to balance treatment/control on covariates.", deftr:"P(Tedavi=1 | X). LogReg veya herhangi bir sınıflandırıcı ile tahmin edilir. IPW (ters-eğilim ağırlıklandırma) ve eşleştirmede kullanılır.", links:[["causal/4","Causal L4"]]},
  {term:"Counterfactual", tr:"Karşı-Olgu", cat:"Causal", def:"\"What would Y be if X had been different?\" Y(x) potential outcome. Cannot directly observe both Y(0) and Y(1) for same unit — fundamental problem of causal inference.", deftr:"\"X farklı olsaydı Y ne olurdu?\" Y(x) potansiyel sonuç. Aynı birim için Y(0) ve Y(1)'i aynı anda gözlemleyemezsin — nedensel çıkarımın temel problemi.", links:[["causal/4","Causal L4"]]},

  // ---- Fairness / Interpretability ----
  {term:"SHAP", tr:"SHAP", cat:"Fairness", def:"SHapley Additive exPlanations (Lundberg 2017). Game-theoretic feature attribution: each feature's contribution averaged over all coalitions. TreeSHAP fast for tree models.", deftr:"SHapley Additive exPlanations (Lundberg 2017). Oyun-teorik özellik atıfı: her özelliğin tüm koalisyonlar üzerinde ortalama katkısı. TreeSHAP ağaç modelleri için hızlı.", links:[["fairness/4","Fairness L4"]]},
  {term:"LIME", tr:"LIME", cat:"Fairness", def:"Local Interpretable Model-Agnostic Explanations (Ribeiro 2016). Perturb input, fit local linear surrogate, explain that point. Works on tabular, text, image.", deftr:"Yerel Yorumlanabilir Model-Bağımsız Açıklamalar (Ribeiro 2016). Girdi karıştırma, yerel lineer vekil model, o noktayı açıkla. Tablo, metin, görüntüde çalışır.", links:[["fairness/5","Fairness L5"]]},
  {term:"Demographic Parity", tr:"Demografik Eşitlik", cat:"Fairness", def:"P(Ŷ=1 | A=0) = P(Ŷ=1 | A=1) — same positive rate across protected attribute groups. Strong but blunt fairness criterion. Conflicts with calibration and equalized odds.", deftr:"P(Ŷ=1 | A=0) = P(Ŷ=1 | A=1) — korumalı öznitelik grupları arasında aynı pozitif oran. Güçlü ama künt adalet kriteri. Kalibrasyon ve eşitlenmiş olasılıklar ile çelişir.", links:[["fairness/2","Fairness L2"]]},
  {term:"Mechanistic Interpretability", tr:"Mekanistik Yorumlanabilirlik", cat:"Fairness", def:"Reverse-engineering neural networks into human-understandable algorithms. Anthropic & Neel Nanda research. Circuits, sparse autoencoders, feature dictionaries.", deftr:"Sinir ağlarını insan-anlaşılır algoritmalara tersine mühendislik. Anthropic ve Neel Nanda araştırması. Devreler, seyrek autoencoder'lar, özellik sözlükleri.", links:[["fairness/7","Fairness L7"]]},

  // ---- Edge ML ----
  {term:"GGUF", tr:"GGUF", cat:"Edge", def:"Successor to GGML format for llama.cpp. Single-file format containing weights + metadata + tokenizer. Standard for running quantized LLMs locally (Q4_K_M, Q8_0 typical).", deftr:"llama.cpp için GGML formatının halefi. Ağırlıklar + metadata + tokenizer içeren tek-dosya format. Quantize edilmiş LLM'leri yerel çalıştırma standardı (tipik Q4_K_M, Q8_0).", links:[["edge/4","Edge L4"]]},
  {term:"llama.cpp", tr:"llama.cpp", cat:"Edge", def:"Gerganov's C++ inference engine for LLaMA-family models. SIMD/AVX/Metal/CUDA backends, GGUF quantization, runs 70B on 32GB RAM. Powers Ollama, LM Studio, GPT4All.", deftr:"Gerganov'un LLaMA-ailesi modeller için C++ çıkarım motoru. SIMD/AVX/Metal/CUDA backend'ler, GGUF quantization, 32GB RAM'de 70B çalıştırır. Ollama, LM Studio, GPT4All'ın temeli.", links:[["edge/4","Edge L4"]]},
  {term:"GPTQ", tr:"GPTQ", cat:"Edge", def:"Frantar 2022. Post-training INT4 quantization for LLMs. Layer-by-layer Hessian-aware rounding. ~3.5× compression, ~1% accuracy loss on most benchmarks.", deftr:"Frantar 2022. LLM'ler için eğitim-sonrası INT4 quantization. Katman-katman Hessian-uyumlu yuvarlama. ~3.5× sıkıştırma, çoğu benchmark'ta ~%1 doğruluk kaybı.", links:[["edge/2","Edge L2"]]},
  {term:"AWQ", tr:"AWQ", cat:"Edge", def:"Activation-aware Weight Quantization (Lin 2023). Identifies salient weights via activation magnitudes, scales them up before quantizing. Better than GPTQ on most tasks.", deftr:"Aktivasyon-uyumlu Ağırlık Quantization (Lin 2023). Aktivasyon büyüklükleri ile önemli ağırlıkları belirler, quantize öncesi onları ölçeklendirir. Çoğu görevde GPTQ'dan iyi.", links:[["edge/2","Edge L2"]]},
  {term:"ONNX", tr:"ONNX", cat:"Edge", def:"Open Neural Network Exchange (Microsoft+Facebook). Cross-framework model format. Train in PyTorch → export → run with ONNXRuntime, TensorRT, CoreML. Standard interchange format.", deftr:"Open Neural Network Exchange (Microsoft+Facebook). Çapraz-çerçeve model formatı. PyTorch'ta eğit → export → ONNXRuntime, TensorRT, CoreML ile çalıştır.", links:[["edge/5","Edge L5"]]},
  {term:"WebGPU", tr:"WebGPU", cat:"Edge", def:"Browser GPU API (W3C, Chrome 113+). Run shaders in browser. Powers Transformers.js, web-llm, Whisper-Web. Brings 100M+ parameter models to client-side.", deftr:"Tarayıcı GPU API'si (W3C, Chrome 113+). Tarayıcıda shader çalıştır. Transformers.js, web-llm, Whisper-Web'in temeli. 100M+ parametreli modelleri istemci-tarafına getirir.", links:[["edge/7","Edge L7"]]},

  // ---- Bioinformatics ----
  {term:"AlphaFold", tr:"AlphaFold", cat:"Bio", def:"DeepMind's protein structure predictor. AF2 (2021): Evoformer + structure module, near-experimental accuracy. AF3 (2024): diffusion-based, predicts complexes incl. ligands.", deftr:"DeepMind'in protein yapı tahmincisi. AF2 (2021): Evoformer + yapı modülü, deneysele yakın doğruluk. AF3 (2024): difüzyon-tabanlı, ligand dahil kompleksleri tahmin eder.", links:[["bio/3","Bio L3"]]},
  {term:"Evoformer", tr:"Evoformer", cat:"Bio", def:"Core block of AlphaFold 2. Triangle attention over MSA + pair representations. Encodes evolutionary co-variation between residues into structural geometry.", deftr:"AlphaFold 2'nin çekirdek bloğu. MSA + çift temsilleri üzerinde üçgen attention. Rezidular arası evrimsel ortak-değişimi yapısal geometriye kodlar.", links:[["bio/3","Bio L3"]]},
  {term:"ESM", tr:"ESM", cat:"Bio", def:"Evolutionary Scale Modeling — Meta's protein language models. ESM-1, ESM-2 (15B params). Trained on 250M proteins with masked LM. Predicts structure, function, fitness without alignment.", deftr:"Evolutionary Scale Modeling — Meta'nın protein dil modelleri. ESM-1, ESM-2 (15B param). Maskeli LM ile 250M protein üzerinde eğitildi. Hizalama gerektirmeden yapı, fonksiyon, uygunluk tahmin eder.", links:[["bio/4","Bio L4"]]},
  {term:"MSA", tr:"MSA (Çoklu Dizi Hizalaması)", cat:"Bio", def:"Multiple Sequence Alignment. Stack of related protein sequences aligned column-by-column. Reveals conserved residues + co-evolution. Critical input for AlphaFold 2.", deftr:"Çoklu Dizi Hizalaması. İlgili protein dizilerinin sütun-sütun hizalanmış yığını. Korunmuş rezidüleri + ortak-evrimi ortaya çıkarır. AlphaFold 2 için kritik girdi.", links:[["bio/2","Bio L2"]]},
  {term:"BLAST", tr:"BLAST", cat:"Bio", def:"Basic Local Alignment Search Tool (Altschul 1990). Finds similar sequences in a database via heuristic seed-and-extend. Workhorse of bioinformatics for 30+ years.", deftr:"Basic Local Alignment Search Tool (Altschul 1990). Sezgisel tohum-ve-uzat ile veritabanında benzer dizileri bulur. 30+ yıldır biyoinformatiğin iş atı.", links:[["bio/1","Bio L1"]]},

  // ---- Cryptography ----
  {term:"AES", tr:"AES", cat:"Crypto", def:"Advanced Encryption Standard (Rijndael, NIST 2001). Block cipher with 128-bit blocks, 128/192/256-bit keys. Default symmetric cipher. Use AES-GCM for AEAD (auth+encrypt).", deftr:"Gelişmiş Şifreleme Standardı (Rijndael, NIST 2001). 128-bit bloklar, 128/192/256-bit anahtarlar. Varsayılan simetrik şifre. AEAD için AES-GCM kullan.", links:[["crypto/1","Crypto L1"]]},
  {term:"ECDSA", tr:"ECDSA", cat:"Crypto", def:"Elliptic Curve Digital Signature Algorithm. Most widely deployed signature scheme (TLS, Bitcoin, SSH). secp256k1 (Bitcoin), P-256 (NIST). Beware nonce reuse — leaks the key.", deftr:"Eliptik Eğri Dijital İmza Algoritması. En yaygın imza şeması (TLS, Bitcoin, SSH). secp256k1 (Bitcoin), P-256 (NIST). Nonce yeniden kullanımı anahtarı sızdırır.", links:[["crypto/2","Crypto L2"]]},
  {term:"Zero-Knowledge Proof", tr:"Sıfır-Bilgi Kanıtı", cat:"Crypto", def:"Proof that proves \"I know X\" without revealing X. Goldwasser-Micali-Rackoff 1985. Modern: zk-SNARKs (Groth16, Plonk), zk-STARKs (transparent, post-quantum). Powers privacy + scaling.", deftr:"\"X biliyorum\" kanıtı, X'i açıklamadan. Goldwasser-Micali-Rackoff 1985. Modern: zk-SNARK (Groth16, Plonk), zk-STARK (şeffaf, post-kuantum). Gizlilik + ölçekleme.", links:[["crypto/5","Crypto L5"]]},
  {term:"Homomorphic Encryption", tr:"Homomorfik Şifreleme", cat:"Crypto", def:"Compute on encrypted data without decrypting. Partial (Paillier — addition only), Fully (Gentry 2009 → BFV/BGV/CKKS). Enables private ML inference. SEAL, OpenFHE libraries.", deftr:"Şifreli veri üzerinde, şifresini çözmeden hesaplama. Kısmi (Paillier — sadece toplama), Tam (Gentry 2009 → BFV/BGV/CKKS). Özel ML çıkarımı sağlar. SEAL, OpenFHE.", links:[["crypto/6","Crypto L6"]]},
  {term:"MPC", tr:"MPC (Çok-Taraflı Hesaplama)", cat:"Crypto", def:"Secure Multiparty Computation: N parties jointly compute f(x1,…,xN) without revealing inputs. Yao GMW BGW SPDZ protocols. Real systems: Sharemind, MP-SPDZ, swanky.", deftr:"Güvenli Çok-Taraflı Hesaplama: N taraf girdileri açıklamadan birlikte f(x1,…,xN) hesaplar. Yao GMW BGW SPDZ protokolleri. Gerçek: Sharemind, MP-SPDZ, swanky.", links:[["crypto/7","Crypto L7"]]},
  {term:"Post-Quantum Crypto", tr:"Post-Kuantum Kriptografi", cat:"Crypto", def:"Cryptography secure against quantum computers. NIST 2024 standards: ML-KEM (Kyber, KEM), ML-DSA (Dilithium, signatures), SLH-DSA (SPHINCS+, hash-based). Lattice-based dominant.", deftr:"Kuantum bilgisayarlara karşı güvenli kriptografi. NIST 2024 standartları: ML-KEM (Kyber), ML-DSA (Dilithium), SLH-DSA (SPHINCS+). Kafes-tabanlı baskın.", links:[["crypto/8","Crypto L8"]]},
  {term:"Side-Channel Attack", tr:"Yan-Kanal Saldırısı", cat:"Crypto", def:"Extract secrets from physical leakage (timing, power, EM, cache). Spectre/Meltdown 2018 (CPU). Defense: constant-time code, masking, blinding.", deftr:"Fiziksel sızıntıdan (zamanlama, güç, EM, önbellek) gizlilik çıkarma. Spectre/Meltdown 2018 (CPU). Savunma: sabit-zaman kod, maskeleme, blinding.", links:[["crypto/10","Crypto L10"]]},

  // ---- ML Security ----
  {term:"Adversarial Example", tr:"Karşıt Örnek", cat:"MLSec", def:"Imperceptibly perturbed input that fools a classifier. Goodfellow 2014 'panda → gibbon'. Generated via FGSM, PGD, C&W. Transferable across models.", deftr:"Sınıflandırıcıyı kandıran algılanamayacak şekilde değiştirilmiş girdi. Goodfellow 2014 'panda → gibbon'. FGSM, PGD, C&W ile üretilir. Modeller arası transfer olur.", links:[["mlsec/2","MLSec L2"]]},
  {term:"PGD", tr:"PGD", cat:"MLSec", def:"Projected Gradient Descent attack (Madry 2017). Iterative FGSM with projection back to L∞ ball. Strongest first-order attack. Madry adversarial training defense uses PGD inner-max.", deftr:"Projected Gradient Descent saldırısı (Madry 2017). L∞ küresine projeksiyonla iteratif FGSM. En güçlü birinci-derece saldırı. Madry karşıt eğitim savunması.", links:[["mlsec/2","MLSec L2"]]},
  {term:"Membership Inference", tr:"Üyelik Çıkarımı", cat:"MLSec", def:"Determine if data point X was in training set of model M. Shokri 2017 shadow models, LiRA likelihood ratio attacks. Defense: DP-SGD, regularization. Major privacy breach if successful.", deftr:"X veri noktasının M modelinin eğitim setinde olup olmadığını belirleme. Shokri 2017 gölge modelleri, LiRA. Savunma: DP-SGD. Başarılıysa büyük gizlilik ihlali.", links:[["mlsec/6","MLSec L6"]]},
  {term:"Model Stealing", tr:"Model Çalma", cat:"MLSec", def:"Black-box query attack to clone a model. Tramèr 2016. Cost: ~$10K to clone GPT-3.5 outputs. Defense: rate limiting, watermarking, decision-only API.", deftr:"Modeli klonlamak için kara-kutu sorgu saldırısı. Tramèr 2016. Maliyet: GPT-3.5 çıktılarını klonlamak ~$10K. Savunma: hız sınırlama, watermark.", links:[["mlsec/5","MLSec L5"]]},
  {term:"Backdoor Attack", tr:"Backdoor Saldırısı", cat:"MLSec", def:"Plant a hidden trigger during training; clean inputs work normally, trigger inputs misclassify. BadNets (Gu 2017). Defense: Neural Cleanse, STRIP, fine-pruning.", deftr:"Eğitim sırasında gizli tetik yerleştir; temiz girdiler normal, tetik girdiler yanlış sınıflandırılır. BadNets (Gu 2017). Savunma: Neural Cleanse, STRIP.", links:[["mlsec/7","MLSec L7"]]},
  {term:"Prompt Injection", tr:"Prompt Enjeksiyonu", cat:"MLSec", def:"User input or external data contains instructions that hijack the LLM. Direct (in user msg) or indirect (in retrieved doc, image, web page). #1 OWASP LLM Top 10.", deftr:"Kullanıcı girdisi veya dış veri LLM'i kaçıran talimatlar içerir. Doğrudan (kullanıcı mesajında) veya dolaylı (alınan doküman, görüntü, web sayfası). OWASP LLM Top 10 #1.", links:[["mlsec/9","MLSec L9"]]},

  // ---- Privacy-Preserving ML ----
  {term:"Differential Privacy", tr:"Diferansiyel Gizlilik", cat:"Privacy", def:"Dwork 2006. Mechanism M is ε-DP if for any neighboring datasets D, D': P[M(D) ∈ S] ≤ e^ε P[M(D') ∈ S]. Strong, mathematical guarantee. Used in US Census 2020.", deftr:"Dwork 2006. M mekanizması ε-DP'dir eğer komşu veri setleri D, D' için: P[M(D) ∈ S] ≤ e^ε P[M(D') ∈ S]. Güçlü matematiksel garanti. ABD 2020 nüfus sayımı.", links:[["privacy/1","Privacy L1"]]},
  {term:"DP-SGD", tr:"DP-SGD", cat:"Privacy", def:"Abadi 2016. Train neural nets with DP: clip per-sample gradients to norm C, add Gaussian noise σ, track ε via moments accountant. Opacus, TF-Privacy implementations.", deftr:"Abadi 2016. Sinir ağlarını DP ile eğit: örnek-başına gradient'leri C normuna kırp, σ Gauss gürültüsü ekle, ε'yu moments accountant ile takip et. Opacus, TF-Privacy.", links:[["privacy/3","Privacy L3"]]},
  {term:"k-Anonymity", tr:"k-Anonimlik", cat:"Privacy", def:"Sweeney 2002. Each record indistinguishable from at least k-1 others on quasi-identifiers. Achieved via generalization, suppression, microaggregation. URV CRISES (Domingo-Ferrer) leading research.", deftr:"Sweeney 2002. Her kayıt yarı-tanımlayıcılarda en az k-1 başka kayıttan ayırt edilemez. Genelleştirme, baskılama, mikroagregasyon ile elde edilir. URV CRISES (Domingo-Ferrer).", links:[["privacy/6","Privacy L6"]]},
  {term:"l-Diversity", tr:"l-Çeşitlilik", cat:"Privacy", def:"Machanavajjhala 2007. Extends k-anonymity: each equivalence class must contain l well-represented sensitive values. Defends against homogeneity + background knowledge attacks.", deftr:"Machanavajjhala 2007. k-anonimliği genişletir: her denklik sınıfı l iyi-temsil edilen hassas değer içermeli. Homojenlik + arka plan bilgisi saldırılarına karşı savunma.", links:[["privacy/6","Privacy L6"]]},
  {term:"Federated Learning", tr:"Federe Öğrenme", cat:"Privacy", def:"McMahan 2017 (Google). Train ML on decentralized data: clients compute gradients locally, server aggregates. FedAvg algorithm. Combined with DP + Secure Aggregation = strong privacy.", deftr:"McMahan 2017 (Google). Merkezi olmayan veri üzerinde ML eğit: istemciler yerel gradient hesaplar, sunucu toplar. FedAvg algoritması. DP + Güvenli Toplama ile güçlü gizlilik.", links:[["privacy/4","Privacy L4"]]},
  {term:"Microaggregation", tr:"Mikroagregasyon", cat:"Privacy", def:"Domingo-Ferrer & Mateo-Sanz 2002 (URV). k-anonymity via clustering similar records into groups of ≥k, replacing with cluster centroid. Preserves analytical utility better than generalization.", deftr:"Domingo-Ferrer & Mateo-Sanz 2002 (URV). Benzer kayıtları ≥k'lık gruplara kümeleyip küme merkezleri ile değiştirerek k-anonimlik. Genelleştirmeye göre analitik fayda daha iyi korur.", links:[["privacy/6","Privacy L6"]]},

  // ---- Network/System Security ----
  {term:"TLS 1.3", tr:"TLS 1.3", cat:"NetSec", def:"Transport Layer Security (RFC 8446, 2018). 1-RTT handshake (vs TLS 1.2 2-RTT), 0-RTT resumption, removed legacy crypto (RC4, MD5, SHA-1). Forward secrecy mandatory.", deftr:"Transport Layer Security (RFC 8446, 2018). 1-RTT handshake (TLS 1.2 2-RTT'ye karşı), 0-RTT yeniden başlatma, eski crypto kaldırıldı. İleri gizlilik zorunlu.", links:[["netsec/1","NetSec L1"]]},
  {term:"OWASP Top 10", tr:"OWASP Top 10", cat:"NetSec", def:"Open Web App Security Project's most critical web vulnerabilities. 2021: A01 broken access control, A02 cryptographic failures, A03 injection, A04 insecure design, etc.", deftr:"Open Web App Security Project'in en kritik web açıkları. 2021: A01 bozuk erişim kontrolü, A02 kriptografik hatalar, A03 enjeksiyon, A04 güvensiz tasarım vb.", links:[["netsec/2","NetSec L2"]]},
  {term:"OAuth 2.0 / OIDC", tr:"OAuth 2.0 / OIDC", cat:"NetSec", def:"Authorization framework (RFC 6749) + identity layer (OpenID Connect). Authorization Code with PKCE for SPAs/mobile, client credentials for service-to-service. Standard for federated auth.", deftr:"Yetkilendirme çerçevesi (RFC 6749) + kimlik katmanı (OpenID Connect). SPA/mobil için PKCE'li Authorization Code, servisler arası için client credentials. Federe kimlik standardı.", links:[["netsec/3","NetSec L3"]]},
  {term:"Zero Trust", tr:"Zero Trust", cat:"NetSec", def:"Security model: never trust, always verify. No implicit perimeter trust. NIST SP 800-207. Google BeyondCorp pioneered. Identity-aware proxy + microsegmentation + continuous verification.", deftr:"Güvenlik modeli: asla güvenme, her zaman doğrula. Örtük çevre güveni yok. NIST SP 800-207. Google BeyondCorp öncüydü. Kimlik-bilinçli proxy + mikrosegmentasyon.", links:[["netsec/10","NetSec L10"]]},
  {term:"WebAuthn / FIDO2", tr:"WebAuthn / FIDO2", cat:"NetSec", def:"W3C 2019 standard for phishing-resistant auth. Public-key cryptography, device-bound credentials. Passkeys (Apple/Google/Microsoft 2022). Replaces passwords.", deftr:"W3C 2019 phishing'e dayanıklı kimlik doğrulama standardı. Açık-anahtar kriptografi, cihaz-bağlı kimlik bilgileri. Passkey (Apple/Google/Microsoft 2022). Parolaları değiştirir.", links:[["netsec/3","NetSec L3"]]},

  // ---- Forensics ----
  {term:"MITRE ATT&CK", tr:"MITRE ATT&CK", cat:"Forensics", def:"Knowledge base of adversary tactics, techniques, procedures. 14 tactics × ~200 techniques. Standard taxonomy for threat hunting, red/purple teaming, SOC alerting.", deftr:"Saldırgan taktik, teknik ve prosedürlerinin bilgi tabanı. 14 taktik × ~200 teknik. Tehdit avı, red/purple team, SOC için standart sınıflandırma.", links:[["forensics/1","Forensics L1"]]},
  {term:"YARA", tr:"YARA", cat:"Forensics", def:"Pattern-matching language for malware research. Define rules with strings + regex + conditions to identify malware families. Used in VirusTotal, every AV engine.", deftr:"Malware araştırması için desen-eşleme dili. String + regex + koşullarla malware ailelerini tanımlama kuralları. VirusTotal, her AV motorunda kullanılır.", links:[["forensics/2","Forensics L2"]]},
  {term:"Volatility", tr:"Volatility", cat:"Forensics", def:"Open-source memory forensics framework. Plugins for process listing, network connections, registry, malware artifacts from RAM dumps. Volatility 3 (Python 3) standard.", deftr:"Açık kaynak bellek adli bilişim çerçevesi. RAM dump'larından süreç listeleme, ağ bağlantıları, registry, malware artefaktları için plugin'ler. Volatility 3 (Python 3) standart.", links:[["forensics/5","Forensics L5"]]},
  {term:"Wireshark / Zeek", tr:"Wireshark / Zeek", cat:"Forensics", def:"Wireshark: GUI packet analyzer. Zeek (formerly Bro): network security monitor with scripting, generates structured logs (conn, dns, http, ssl). Both essential for network forensics.", deftr:"Wireshark: GUI paket analiz aracı. Zeek (eski Bro): script destekli ağ güvenlik monitörü, yapılandırılmış loglar (conn, dns, http, ssl) üretir. Ağ adli bilişimi için temel.", links:[["forensics/6","Forensics L6"]]},

  // ---- Blockchain ----
  {term:"Smart Contract", tr:"Akıllı Sözleşme", cat:"Blockchain", def:"Self-executing code on a blockchain (Ethereum 2015). Solidity language → EVM bytecode. Code-is-law. Vulnerabilities: reentrancy, integer overflow, oracle attacks. $3B+ stolen 2020-2024.", deftr:"Blockchain üzerinde kendi-yürüyen kod (Ethereum 2015). Solidity dili → EVM bytecode. Kod-yasadır. Açıklar: reentrancy, tamsayı taşması, oracle saldırıları. 2020-2024'te $3B+ çalındı.", links:[["blockchain/3","Blockchain L3"]]},
  {term:"Reentrancy", tr:"Reentrancy", cat:"Blockchain", def:"Smart contract vuln: external call lets attacker re-enter the contract before state update. The DAO 2016 ($60M ETH stolen → Ethereum hard fork). Fix: checks-effects-interactions pattern.", deftr:"Akıllı sözleşme açığı: dış çağrı saldırganın state güncellemesinden önce sözleşmeye yeniden girmesine izin verir. The DAO 2016 ($60M ETH çalındı → Ethereum hard fork). Düzeltme: checks-effects-interactions.", links:[["blockchain/4","Blockchain L4"]]},
  {term:"Flash Loan", tr:"Flash Loan", cat:"Blockchain", def:"Uncollateralized loan in DeFi: borrow + use + repay in single transaction. Aave/dYdX feature. Powers price oracle attacks, governance attacks. $1B+ in flash loan exploits.", deftr:"DeFi'de teminatsız kredi: tek işlemde borç al + kullan + geri öde. Aave/dYdX özelliği. Fiyat oracle saldırılarını, yönetişim saldırılarını besler. $1B+ flash loan exploit.", links:[["blockchain/7","Blockchain L7"]]},
  {term:"ZK Rollup", tr:"ZK Rollup", cat:"Blockchain", def:"L2 scaling: thousands of transactions batched off-chain, validity proof posted on-chain. zkSync, StarkNet, Polygon zkEVM. ~100× throughput, instant finality. Validity proofs > optimistic 7-day window.", deftr:"L2 ölçekleme: binlerce işlem off-chain batch'lenir, geçerlilik kanıtı on-chain gönderilir. zkSync, StarkNet, Polygon zkEVM. ~100× throughput, anında kesinlik.", links:[["blockchain/6","Blockchain L6"]]},

  // ---- IoT ----
  {term:"TPM 2.0", tr:"TPM 2.0", cat:"IoT", def:"Trusted Platform Module — secure crypto coprocessor on motherboard. Stores keys, supports attestation, secure boot. ISO/IEC 11889 standard. Required for Windows 11.", deftr:"Güvenilir Platform Modülü — anakartta güvenli kripto eş-işlemci. Anahtar saklar, attestation, secure boot destekler. ISO/IEC 11889 standardı. Windows 11 için gerekli.", links:[["iot/2","IoT L2"]]},
  {term:"Mirai Botnet", tr:"Mirai Botnet", cat:"IoT", def:"2016 IoT botnet of 600K+ infected cameras/routers. Default-credential brute force. DDoS'd Krebs, Dyn (Twitter/Reddit/Netflix down). Source code public — spawned variants.", deftr:"2016 IoT botnet'i, 600K+ enfekte kamera/router. Varsayılan kimlik bilgisi brute force. Krebs, Dyn'i DDoS'ladı (Twitter/Reddit/Netflix kesildi). Kaynak kod halka açık.", links:[["iot/1","IoT L1"]]},
  {term:"Stuxnet", tr:"Stuxnet", cat:"IoT", def:"2010 cyber-weapon (US/Israel) targeting Iranian nuclear centrifuges. 4 zero-days, Siemens PLC manipulation. First public weaponized cyber attack on industrial systems.", deftr:"2010 siber-silah (ABD/İsrail) İran nükleer santrifüjlerini hedefledi. 4 zero-day, Siemens PLC manipülasyonu. Endüstriyel sistemlere ilk halka açık silahlı siber saldırı.", links:[["iot/5","IoT L5"]]},

  // ---- Compliance ----
  {term:"GDPR", tr:"GDPR", cat:"Compliance", def:"EU General Data Protection Regulation (2018). Lawful basis for processing, data subject rights (access, erasure, portability), DPIA, fines up to 4% global revenue. Article 22 governs automated decisions.", deftr:"AB Genel Veri Koruma Tüzüğü (2018). İşleme için yasal dayanak, veri sahibi hakları (erişim, silme, taşınabilirlik), DPIA, küresel gelirin %4'üne kadar para cezası. Madde 22 otomatik kararları yönetir.", links:[["compliance/1","Compliance L1"]]},
  {term:"EU AI Act", tr:"EU AI Yasası", cat:"Compliance", def:"World's first comprehensive AI law (2024). Risk-tiered: unacceptable (banned), high-risk (compliance), limited (transparency), minimal. GPAI obligations for foundation models. Effective 2026 fully.", deftr:"Dünyanın ilk kapsamlı AI yasası (2024). Risk-katmanlı: kabul edilemez (yasak), yüksek-risk (uyum), sınırlı (şeffaflık), minimal. Temel modeller için GPAI yükümlülükleri. 2026'da tam yürürlükte.", links:[["compliance/2","Compliance L2"]]},
  {term:"NIST AI RMF", tr:"NIST AI RMF", cat:"Compliance", def:"AI Risk Management Framework (NIST AI 100-1, 2023). Voluntary US framework: Govern, Map, Measure, Manage. Aligns with EU AI Act. Companion: NIST GenAI profile (2024).", deftr:"AI Risk Yönetim Çerçevesi (NIST AI 100-1, 2023). Gönüllü ABD çerçevesi: Govern, Map, Measure, Manage. AB AI Yasası ile uyumlu. Tamamlayıcı: NIST GenAI profili (2024).", links:[["compliance/4","Compliance L4"]]},
  {term:"ISO/IEC 42001", tr:"ISO/IEC 42001", cat:"Compliance", def:"AI Management System standard (Dec 2023). Like ISO 27001 but for AI. Covers governance, risk, lifecycle. First certifiable AI standard. Complements EU AI Act conformity.", deftr:"AI Yönetim Sistemi standardı (Aralık 2023). ISO 27001 gibi ama AI için. Yönetişim, risk, yaşam döngüsü. İlk sertifikalanabilir AI standardı. EU AI Yasası uyumunu tamamlar.", links:[["compliance/6","Compliance L6"]]},

  // ---- ML ----
  {term:"Bias-Variance Tradeoff", tr:"Yanlılık-Varyans Dengesi", cat:"ML", def:"Total prediction error decomposes into bias² (model too simple) + variance (model too complex) + irreducible noise. The art of ML is balancing the two.", deftr:"Toplam tahmin hatası bias² (model çok basit) + variance (model çok karmaşık) + indirgenemez gürültüye ayrışır. ML sanatı bu ikisini dengelemektir.", links:[["ml-theory/4","ML L4"]]},
  {term:"Overfitting", tr:"Aşırı Öğrenme", cat:"ML", def:"When a model memorizes training data noise instead of learning the underlying pattern — high training accuracy, low test accuracy.", deftr:"Modelin altta yatan örüntü yerine eğitim verisi gürültüsünü ezberlemesi — yüksek eğitim doğruluğu, düşük test doğruluğu.", links:[["ml-theory/4","ML L4"],["ml-theory/6","ML L6"]]},
  {term:"Regularization", tr:"Düzenleme", cat:"ML", def:"Adding a penalty term (L1/L2 norm, dropout) to the loss to discourage overly complex models. Combats overfitting.", deftr:"Karmaşık modelleri caydırmak için kayba ceza terimi (L1/L2 norm, dropout) eklemek. Overfitting'e karşı.", links:[["ml-theory/6","ML L6"]]},
  {term:"Cross-Validation", tr:"Çapraz Doğrulama", cat:"ML", def:"Splitting data into k folds and training k times, each time holding out one fold for validation. Provides robust performance estimates without a separate test set.", deftr:"Veriyi k katmana bölüp k kez eğitmek, her seferinde bir katmanı doğrulama için ayırmak. Ayrı test seti olmadan sağlam performans tahmini sunar.", links:[["sklearn/4","sklearn L4"]]},
  {term:"Confusion Matrix", tr:"Karmaşıklık Matrisi", cat:"ML", def:"A 2×2 (or N×N) table showing TP/FP/FN/TN counts for a classifier. Foundation of precision, recall, F1 calculations.", deftr:"Bir sınıflandırıcı için TP/FP/FN/TN sayılarını gösteren 2×2 (veya N×N) tablo. Precision, recall, F1 hesaplarının temeli.", links:[["sklearn/6","sklearn L6"],["ml-theory/5","ML L5"]]},
  {term:"PCA", tr:"PCA", cat:"ML", def:"Principal Component Analysis — find orthogonal directions of maximum variance in data, project onto top-k components for dimensionality reduction.", deftr:"Temel Bileşen Analizi — veride maksimum varyansın ortogonal yönlerini bul, boyut azaltma için top-k bileşene yansıt.", links:[["linalg/4","Linalg L4"],["ml-theory/9","ML L9"],["sklearn/8","sklearn L8"]]},
  {term:"Naive Bayes", tr:"Naive Bayes", cat:"ML", def:"A probabilistic classifier using Bayes' theorem with a strong (naive) feature independence assumption. Fast, surprisingly effective for text classification.", deftr:"Bayes teoremini güçlü (naif) özellik bağımsızlığı varsayımıyla kullanan olasılıksal sınıflandırıcı. Hızlı, metin sınıflandırmada şaşırtıcı derecede etkili.", links:[["nlp/3","NLP L3"]]},
  {term:"Gradient Descent", tr:"Gradyan İnişi", cat:"ML", def:"Iterative optimization: compute gradient of loss w.r.t. weights, step in negative direction. The engine of all modern ML.", deftr:"İteratif optimizasyon: kaybın ağırlıklara göre gradyanını hesapla, negatif yönde adım at. Tüm modern ML'in motoru.", links:[["calculus/5","Calculus L5"],["deep/4","Deep L4"]]},

  // ---- Deep Learning ----
  {term:"Backpropagation", tr:"Geri Yayılım", cat:"DL", def:"The chain-rule algorithm for computing gradients through a neural network — the foundation of deep learning training.", deftr:"Bir sinir ağı boyunca gradyanları hesaplamak için zincir kuralı algoritması — derin öğrenme eğitiminin temeli.", links:[["deep/3","Deep L3"]]},
  {term:"ReLU", tr:"ReLU", cat:"DL", def:"Rectified Linear Unit — f(x) = max(0, x). The most common activation function. Solves vanishing gradients of sigmoid/tanh.", deftr:"Doğrultulmuş Doğrusal Birim — f(x) = max(0, x). En yaygın aktivasyon fonksiyonu. Sigmoid/tanh'in kaybolan gradyan problemini çözer.", links:[["deep/2","Deep L2"]]},
  {term:"Softmax", tr:"Softmax", cat:"DL", def:"Converts a vector of K real numbers into a probability distribution over K classes — exp(z_i) / Σ exp(z_j).", deftr:"K gerçek sayı vektörünü K sınıf üzerinde olasılık dağılımına çevirir — exp(z_i) / Σ exp(z_j).", links:[["deep/2","Deep L2"]]},
  {term:"Cross-Entropy Loss", tr:"Çapraz Entropi Kaybı", cat:"DL", def:"The standard loss for classification: -Σ y log(p). Punishes confident wrong predictions heavily, lightly punishes uncertain wrong predictions.", deftr:"Sınıflandırma için standart kayıp: -Σ y log(p). Güvenle yanlış tahminleri ağır cezalandırır, belirsiz yanlışları hafif.", links:[["deep/2","Deep L2"]]},
  {term:"Adam", tr:"Adam", cat:"DL", def:"Adaptive Moment Estimation — an optimizer that combines momentum (1st moment) with RMSProp (2nd moment). Default choice for most deep learning today.", deftr:"Adaptif Moment Tahmini — momentum (1. moment) ile RMSProp (2. moment) birleştiren optimize edici. Bugün çoğu derin öğrenme için varsayılan seçim.", links:[["deep/4","Deep L4"]]},
  {term:"Dropout", tr:"Dropout", cat:"DL", def:"Randomly zero out p% of activations during training. Forces the network to not rely on any single neuron — a strong regularizer.", deftr:"Eğitim sırasında aktivasyonların %p'sini rastgele sıfırla. Ağı tek bir nörona güvenmemeye zorlar — güçlü düzenleyici.", links:[["deep/5","Deep L5"]]},
  {term:"Batch Normalization", tr:"Batch Normalizasyon", cat:"DL", def:"Normalize layer inputs across the batch dimension to mean 0, variance 1. Stabilizes training and allows higher learning rates.", deftr:"Katman girişlerini batch boyutunda 0 ortalama, 1 varyansa normalize et. Eğitimi stabilize eder ve daha yüksek öğrenme oranı sağlar.", links:[["deep/5","Deep L5"]]},

  // ---- CV ----
  {term:"Convolution", tr:"Konvolüsyon", cat:"CV", def:"Slide a small filter (e.g., 3×3) across an image, computing dot products at each position. The fundamental operation of CNNs.", deftr:"Bir görüntü üzerinde küçük bir filtreyi (örn. 3×3) kaydır, her pozisyonda iç çarpım hesapla. CNN'lerin temel işlemi.", links:[["deep/6","Deep L6"],["cv/5","CV L5"]]},
  {term:"IoU", tr:"IoU (Kesişim/Birleşim)", cat:"CV", def:"Intersection over Union — area of overlap divided by area of union for two bounding boxes. The standard metric for object detection.", deftr:"Kesişim/Birleşim — iki sınırlayıcı kutunun örtüşme alanını birleşim alanına böler. Nesne tespitinin standart metriği.", links:[["cv/6","CV L6"]]},
  {term:"NMS", tr:"NMS (Non-Maximum Suppression)", cat:"CV", def:"Non-Maximum Suppression — given many overlapping detection boxes, keep only the highest-confidence one per object cluster.", deftr:"Maksimum-Olmayan Bastırma — birçok örtüşen tespit kutusu varsa, her nesne kümesi için en yüksek güvenilirliğe sahip olanı tut.", links:[["cv/6","CV L6"]]},
  {term:"ResNet", tr:"ResNet", cat:"CV", def:"Residual Network — uses skip connections (x + F(x)) so very deep networks (50–152 layers) can be trained without vanishing gradients. 2015 ImageNet winner.", deftr:"Artık Ağ — skip bağlantılar (x + F(x)) kullanarak çok derin ağların (50-152 katman) kaybolan gradyan olmadan eğitilmesini sağlar. 2015 ImageNet kazananı.", links:[["cv/5","CV L5"]]},
  {term:"ViT", tr:"ViT (Vision Transformer)", cat:"CV", def:"Vision Transformer — split image into 16×16 patches, treat as tokens, feed into a transformer. Scales better than CNN with large data.", deftr:"Görüntü Transformer'ı — görüntüyü 16×16 yamalara böl, token olarak işle, transformer'a besle. Büyük veride CNN'den daha iyi ölçeklenir.", links:[["cv/8","CV L8"]]},
  {term:"GAN", tr:"GAN", cat:"CV", def:"Generative Adversarial Network — two networks (generator + discriminator) play a min-max game. Foundation of pre-2020 image generation.", deftr:"Üretken Çekişmeli Ağ — iki ağ (üretici + ayırt edici) min-max oyunu oynar. 2020 öncesi görüntü üretiminin temeli.", links:[["cv/9","CV L9"],["deep/10","Deep L10"]]},
  {term:"Diffusion Model", tr:"Difüzyon Modeli", cat:"CV", def:"Iteratively add Gaussian noise to data during training, learn to reverse this process at inference. Powers Stable Diffusion, DALL-E 2, Sora.", deftr:"Eğitim sırasında veriye iteratif Gauss gürültüsü ekle, çıkarımda bu süreci tersine çevirmeyi öğren. Stable Diffusion, DALL-E 2, Sora'yı çalıştırır.", links:[["cv/9","CV L9"],["deep/10","Deep L10"]]},
  {term:"CLIP", tr:"CLIP", cat:"CV", def:"Contrastive Language-Image Pretraining — joint embedding of text and images. Enables zero-shot classification: just describe the class in words.", deftr:"Karşıt Dil-Görüntü Önceden Eğitimi — metin ve görüntülerin ortak gömme'si. Zero-shot sınıflandırmayı sağlar: sınıfı sadece kelimelerle tanımla.", links:[["cv/10","CV L10"]]},

  // ---- Audio ----
  {term:"Spectrogram", tr:"Spektrogram", cat:"Audio", def:"A 2D time-frequency representation of audio — energy at each frequency bin over time. Computed via STFT (Short-Time Fourier Transform).", deftr:"Sesin 2B zaman-frekans temsili — her frekans bandındaki enerji zaman içinde. STFT (Kısa Zamanlı Fourier Dönüşümü) ile hesaplanır.", links:[["audio/2","Audio L2"]]},
  {term:"MFCC", tr:"MFCC", cat:"Audio", def:"Mel-Frequency Cepstral Coefficients — a compact perceptual feature vector for audio. The classic input for pre-deep-learning ASR.", deftr:"Mel-Frekans Kepstral Katsayılar — ses için kompakt algısal özellik vektörü. Derin öğrenme öncesi ASR'ın klasik girdisi.", links:[["audio/3","Audio L3"]]},
  {term:"Whisper", tr:"Whisper", cat:"Audio", def:"OpenAI's open-source speech recognition model (2022) — multilingual, robust to noise, near state-of-the-art on benchmarks.", deftr:"OpenAI'nin açık kaynak konuşma tanıma modeli (2022) — çok dilli, gürültüye dayanıklı, benchmark'larda yakın-en-iyi seviyede.", links:[["audio/4","Audio L4"]]},

  // ---- RL ----
  {term:"MDP", tr:"MDP (Markov Karar Süreci)", cat:"RL", def:"Markov Decision Process — formal RL framework: states, actions, transition probabilities, rewards, discount factor γ.", deftr:"Markov Karar Süreci — biçimsel RL çerçevesi: durumlar, eylemler, geçiş olasılıkları, ödüller, indirim faktörü γ.", links:[["rl/2","RL L2"]]},
  {term:"Bellman Equation", tr:"Bellman Denklemi", cat:"RL", def:"V(s) = max_a [R(s,a) + γ E[V(s')]]. Recursive definition of the optimal value function — the foundation of dynamic programming in RL.", deftr:"V(s) = max_a [R(s,a) + γ E[V(s')]]. Optimal değer fonksiyonunun rekürsif tanımı — RL'de dinamik programlamanın temeli.", links:[["rl/2","RL L2"]]},
  {term:"Q-Learning", tr:"Q-Öğrenme", cat:"RL", def:"Off-policy TD algorithm. Update: Q(s,a) ← Q(s,a) + α[r + γ max Q(s',a') − Q(s,a)]. Learns optimal Q-values without a model.", deftr:"Politika-dışı TD algoritması. Güncelleme: Q(s,a) ← Q(s,a) + α[r + γ max Q(s',a') − Q(s,a)]. Modelsiz optimal Q-değerleri öğrenir.", links:[["rl/5","RL L5"]]},
  {term:"PPO", tr:"PPO", cat:"RL", def:"Proximal Policy Optimization — clipped surrogate objective prevents the policy from changing too much per update. Default modern policy-gradient method.", deftr:"Yakınsak Politika Optimizasyonu — kırpılmış yardımcı amaç fonksiyonu, politikanın güncellemede çok fazla değişmesini önler. Modern varsayılan politika-gradyan yöntemi.", links:[["rl/9","RL L9"]]},
  {term:"DQN", tr:"DQN", cat:"RL", def:"Deep Q-Network — neural network approximates Q(s,a). Stabilization tricks: replay buffer + target network. Powered Atari breakthrough (2013).", deftr:"Derin Q-Ağı — sinir ağı Q(s,a)'yı yaklaşır. Stabilizasyon: replay buffer + hedef ağ. Atari atılımını gerçekleştirdi (2013).", links:[["rl/6","RL L6"]]},

  // ---- MLOps ----
  {term:"CI/CD", tr:"CI/CD", cat:"MLOps", def:"Continuous Integration / Continuous Deployment — automated pipelines to test code on every commit and deploy on every merge. Standard for production software.", deftr:"Sürekli Entegrasyon / Sürekli Dağıtım — her commit'te kodu test eden ve her merge'de dağıtan otomatik boru hatları. Üretim yazılımı için standart.", links:[["mlops/3","MLOps L3"]]},
  {term:"Docker", tr:"Docker", cat:"MLOps", def:"Container platform that packages an app + all its dependencies into a portable image. Solves 'works on my machine'. Foundation of cloud ML deployment.", deftr:"Bir uygulamayı + tüm bağımlılıklarını taşınabilir bir imaja paketleyen konteyner platformu. 'Bende çalışıyor' problemini çözer. Bulut ML dağıtımının temeli.", links:[["mlops/2","MLOps L2"]]},
  {term:"Model Drift", tr:"Model Sapması", cat:"MLOps", def:"When a deployed model's performance degrades over time because the input data distribution shifts away from the training distribution.", deftr:"Bir dağıtılmış modelin performansının zamanla düşmesi, çünkü girdi veri dağılımı eğitim dağılımından sapar.", links:[["mlops/8","MLOps L8"]]},
  {term:"MLflow", tr:"MLflow", cat:"MLOps", def:"Open-source platform for ML experiment tracking, model registry, and deployment. Logs params/metrics/artifacts for every run.", deftr:"ML deney takibi, model kayıt defteri ve dağıtım için açık kaynak platform. Her çalıştırma için parametre/metrik/eseri loglar.", links:[["mlops/3","MLOps L3"]]},

  // ---- Foundations ----
  {term:"Variable", tr:"Değişken", cat:"Foundations", def:"A named binding to a memory location holding a value. In Python everything is a reference; in C variables map directly to addresses.", deftr:"Bir değer tutan bellek konumuna verilen isimli bağ. Python'da her şey referanstır; C'de değişkenler doğrudan adreslere eşlenir.", links:[["python/1","Python L1"],["c/1","C L1"]]},
  {term:"Function", tr:"Fonksiyon", cat:"Foundations", def:"A reusable block of code with parameters and (optionally) a return value. First-class objects in Python — passable as arguments.", deftr:"Parametreli ve isteğe bağlı dönüş değerli yeniden kullanılabilir kod bloğu. Python'da birinci sınıf nesneler — argüman olarak geçilebilir.", links:[["python/3","Python L3"],["js/3","JS L3"]]},
  {term:"OOP", tr:"OOP (Nesne Yönelimli)", cat:"Foundations", def:"Object-Oriented Programming — encapsulating state and behavior in classes. Pillars: encapsulation, inheritance, polymorphism, abstraction.", deftr:"Nesne Yönelimli Programlama — durum ve davranışı sınıflarda kapsama. Sütunlar: kapsülleme, kalıtım, çok biçimlilik, soyutlama.", links:[["python/5","Python L5"],["cpp/2","C++ L2"]]},
  {term:"Recursion", tr:"Özyineleme", cat:"Foundations", def:"A function that calls itself with a smaller subproblem. Requires a base case to terminate. Used in tree traversal, divide-and-conquer.", deftr:"Daha küçük bir alt-problem ile kendini çağıran fonksiyon. Sonlanmak için temel durum gerekir. Ağaç gezintisi, böl-ve-yönet algoritmalarında kullanılır.", links:[["python/3","Python L3"],["cpp/3","C++ L3"]]},
  {term:"Big-O", tr:"Big-O (Karmaşıklık)", cat:"Foundations", def:"Asymptotic upper bound on running time as input grows. O(1) constant, O(log n), O(n), O(n log n) — sort, O(n²) — pairs, O(2ⁿ) — subsets.", deftr:"Girdi büyüdükçe çalışma süresinin asimptotik üst sınırı. O(1) sabit, O(log n), O(n), O(n log n) — sıralama, O(n²) — çiftler, O(2ⁿ) — alt kümeler.", links:[["python/4","Python L4"]]},
  {term:"Pointer", tr:"Pointer (İşaretçi)", cat:"Foundations", def:"A variable that holds a memory address. Foundation of C/C++; enables manual memory management, dynamic data structures, low-level I/O.", deftr:"Bir bellek adresini tutan değişken. C/C++'ın temeli; manuel bellek yönetimi, dinamik veri yapıları, düşük seviyeli G/Ç sağlar.", links:[["c/2","C L2"],["c/3","C L3"]]},
  {term:"Closure", tr:"Kapanış (Closure)", cat:"Foundations", def:"A function that captures variables from its enclosing lexical scope, even after that scope has ended. Common in Python and JavaScript.", deftr:"Tanımlı olduğu kapsayıcı sözcüksel kapsamdan değişkenleri yakalayan, hatta o kapsam bittikten sonra bile yakalayan fonksiyon. Python ve JS'de yaygın.", links:[["js/4","JS L4"],["python/3","Python L3"]]},
  {term:"Async/Await", tr:"Async/Await", cat:"Foundations", def:"Concurrent programming primitive that pauses a function while awaiting an I/O result and resumes when ready. Non-blocking, single-threaded.", deftr:"Bir fonksiyonu I/O sonucu beklerken duraklatıp hazır olunca devam ettiren eşzamanlı programlama ilkeli. Engellemeyen, tek-iş parçacıklı.", links:[["js/7","JS L7"],["python/6","Python L6"]]},

  // ---- Math ----
  {term:"Gradient", tr:"Gradyan", cat:"Math", def:"The vector of partial derivatives of a multivariable function. Points in the direction of steepest ascent. Foundation of gradient descent.", deftr:"Çok değişkenli bir fonksiyonun kısmi türev vektörü. En dik yükseliş yönüne işaret eder. Gradyan inişinin temeli.", links:[["calculus/2","Calculus L2"],["math/5","Math L5"]]},
