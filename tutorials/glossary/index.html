  {term:"Hessian", tr:"Hessian", cat:"Math", def:"The square matrix of second-order partial derivatives. Encodes curvature; positive-definite Hessian = local minimum, indefinite = saddle point.", deftr:"İkinci dereceden kısmi türevlerin kare matrisi. Eğriliği kodlar; pozitif belirli Hessian = yerel minimum, belirsiz = eyer noktası.", links:[["math/5","Math L5"],["math/7","Math L7"]]},
  {term:"Eigenvalue", tr:"Özdeğer", cat:"Math", def:"Scalar λ such that Av = λv for some non-zero vector v. Reveals invariant directions of a linear transformation; basis of PCA, spectral methods.", deftr:"Sıfırdan farklı bir v vektörü için Av = λv olacak skaler λ. Bir doğrusal dönüşümün değişmez yönlerini açığa çıkarır; PCA, spektral yöntemlerin temeli.", links:[["linalg/3","Linalg L3"]]},
  {term:"SVD", tr:"SVD (Tekil Değer Ayrışımı)", cat:"Math", def:"Singular Value Decomposition: A = U Σ Vᵀ. Decomposes any matrix into rotation × scaling × rotation. Powers PCA, latent semantic analysis, matrix completion.", deftr:"Tekil Değer Ayrışımı: A = U Σ Vᵀ. Herhangi bir matrisi dönme × ölçek × dönme olarak ayrıştırır. PCA, gizli anlamsal analiz, matris tamamlamanın temeli.", links:[["linalg/3","Linalg L3"],["math/3","Math L3"]]},
  {term:"Bayes' Theorem", tr:"Bayes Teoremi", cat:"Math", def:"P(A|B) = P(B|A) P(A) / P(B). Inverts conditional probability. Foundation of Bayesian inference, Naive Bayes classifier, evidence update.", deftr:"P(A|B) = P(B|A) P(A) / P(B). Koşullu olasılığı tersine çevirir. Bayesçi çıkarım, Naive Bayes sınıflandırıcı, kanıt güncellemesinin temeli.", links:[["math/3","Math L3"],["ml-theory/8","ML Theory L8"]]},
  {term:"MLE", tr:"MLE (Maksimum Olabilirlik)", cat:"Math", def:"Maximum Likelihood Estimation: choose parameters θ that maximize the probability of observed data. Equivalent to minimizing cross-entropy loss in classification.", deftr:"Maksimum Olabilirlik Tahmini: gözlenen verinin olasılığını maksimize eden θ parametrelerini seç. Sınıflandırmada cross-entropy kaybını minimize etmeye eşdeğer.", links:[["math/2","Math L2"],["math/3","Math L3"]]},
  {term:"KL Divergence", tr:"KL Iraksaması", cat:"Math", def:"D_KL(P‖Q) = Σ P(x) log(P(x)/Q(x)). Asymmetric measure of how P differs from Q. Used in VAE objective, RLHF, mutual information.", deftr:"D_KL(P‖Q) = Σ P(x) log(P(x)/Q(x)). P'nin Q'dan ne kadar farklı olduğunun asimetrik ölçüsü. VAE objesi, RLHF, karşılıklı bilgide kullanılır.", links:[["math/4","Math L4"],["math/9","Math L9"],["rl/10","RL L10"]]},
  {term:"Cross-Entropy", tr:"Çapraz Entropi", cat:"Math", def:"H(p,q) = −Σ p(x) log q(x). Standard loss for classification; equivalent to negative log-likelihood under MLE assumption.", deftr:"H(p,q) = −Σ p(x) log q(x). Sınıflandırma için standart kayıp; MLE varsayımı altında negatif log-olabilirliğe eşdeğer.", links:[["math/4","Math L4"],["deep/3","Deep L3"]]},

  // ---- ML Metrics ----
  {term:"Precision", tr:"Kesinlik", cat:"ML", def:"TP / (TP + FP) — of all positive predictions, what fraction were correct. High precision = few false alarms.", deftr:"TP / (TP + FP) — tüm pozitif tahminlerin ne kadarı doğruydu. Yüksek kesinlik = az yanlış alarm.", links:[["ml-theory/9","ML Theory L9"],["sklearn/7","sklearn L7"]]},
  {term:"Recall", tr:"Duyarlılık", cat:"ML", def:"TP / (TP + FN) — of all actual positives, what fraction did we find. High recall = few missed cases.", deftr:"TP / (TP + FN) — tüm gerçek pozitiflerin ne kadarını bulduk. Yüksek duyarlılık = az kaçırılan vaka.", links:[["ml-theory/9","ML Theory L9"],["sklearn/7","sklearn L7"]]},
  {term:"F1 Score", tr:"F1 Skoru", cat:"ML", def:"Harmonic mean of precision and recall: 2·P·R / (P+R). Single number balancing both. Used when classes are imbalanced.", deftr:"Kesinlik ve duyarlılığın harmonik ortalaması: 2·P·R / (P+R). İkisini dengeleyen tek sayı. Sınıflar dengesizken kullanılır.", links:[["ml-theory/9","ML Theory L9"],["sklearn/7","sklearn L7"]]},
  {term:"ROC-AUC", tr:"ROC-AUC", cat:"ML", def:"Area under the Receiver Operating Characteristic curve. Threshold-independent measure of separability. 1.0 = perfect, 0.5 = random.", deftr:"Receiver Operating Characteristic eğrisi altındaki alan. Eşikten bağımsız ayırt edicilik ölçüsü. 1.0 = mükemmel, 0.5 = rastgele.", links:[["ml-theory/9","ML Theory L9"],["sklearn/7","sklearn L7"]]},
  {term:"TF-IDF", tr:"TF-IDF", cat:"NLP", def:"Term Frequency × Inverse Document Frequency. Weights words by how distinctive they are to a document. Classical sparse text representation before embeddings.", deftr:"Terim Sıklığı × Ters Doküman Sıklığı. Bir dokümana ne kadar ayırt edici olduklarına göre kelimeleri ağırlıklandırır. Embedding öncesi klasik seyrek metin gösterimi.", links:[["nlp/3","NLP L3"]]},
  {term:"BLEU", tr:"BLEU", cat:"NLP", def:"BiLingual Evaluation Understudy — n-gram overlap metric for machine translation. Range 0–1 (higher better). Imperfect proxy for fluency.", deftr:"BiLingual Evaluation Understudy — makine çevirisi için n-gram örtüşme metriği. Aralık 0-1 (yüksek daha iyi). Akıcılık için kusurlu vekil.", links:[["nlp/12","NLP L12"]]},
  {term:"Perplexity", tr:"Şaşırma (Perplexity)", cat:"NLP", def:"exp(cross-entropy) — how 'surprised' a language model is by held-out text. Lower = better fit. Standard LM eval metric.", deftr:"exp(cross-entropy) — bir dil modelinin geride bırakılan metne ne kadar 'şaşırdığı'. Düşük = daha iyi uyum. Standart LM değerlendirme metriği.", links:[["nlp/11","NLP L11"]]},
  {term:"Chain-of-Thought", tr:"Düşünce Zinciri", cat:"NLP", def:"Prompting technique where the model is asked to show step-by-step reasoning before the answer. Boosts accuracy on math, logic, multi-step problems.", deftr:"Modelin cevaptan önce adım adım akıl yürütmeyi göstermesi istenen prompt tekniği. Matematik, mantık, çok adımlı problemlerde doğruluğu artırır.", links:[["langchain/3","LangChain L3"],["agents/2","Agents L2"]]},
  {term:"Beam Search", tr:"Beam Search", cat:"NLP", def:"Decoding strategy that keeps the top-k partial sequences at each step. Better than greedy, cheaper than full search. Used in translation, summarization.", deftr:"Her adımda en iyi k kısmi diziyi tutan kod çözme stratejisi. Açgözlüden iyi, tam aramadan ucuz. Çeviri, özetlemede kullanılır.", links:[["nlp/11","NLP L11"]]},
  {term:"MoE", tr:"MoE (Uzmanlar Karışımı)", cat:"NLP", def:"Mixture of Experts — a router selects k of N expert sub-networks per token. Total params huge (e.g. 1T) but active params small (e.g. 70B). GPT-4, Mixtral, DeepSeek.", deftr:"Uzmanlar Karışımı — bir yönlendirici her token için N uzmandan k tanesini seçer. Toplam parametre büyük (örn 1T), aktif parametre küçük (örn 70B). GPT-4, Mixtral, DeepSeek.", links:[["huggingface/8","HF L8"]]},
  {term:"Quantization", tr:"Niceleme", cat:"DL", def:"Reduce model precision (FP32 → INT8/INT4) to shrink size and speed up inference at small accuracy cost. Critical for edge / mobile deployment.", deftr:"Modeli kayar nokta hassasiyetinden (FP32 → INT8/INT4) düşürerek boyutu küçült ve çıkarımı hızlandır. Edge/mobil dağıtım için kritik.", links:[["edge/3","Edge L3"],["huggingface/9","HF L9"]]},
  {term:"Knowledge Distillation", tr:"Bilgi Damıtma", cat:"DL", def:"Train a small 'student' model to mimic a large 'teacher' model's outputs. Common path to mobile-friendly LLMs (DistilBERT, TinyLlama).", deftr:"Küçük 'öğrenci' modeli büyük 'öğretmen' modelin çıktılarını taklit edecek şekilde eğit. Mobil-dostu LLM'lere yaygın yol (DistilBERT, TinyLlama).", links:[["edge/3","Edge L3"]]},

  // ---- Cybersec ----
  {term:"CIA Triad", tr:"CIA Üçlüsü", cat:"Cybersec", def:"Confidentiality, Integrity, Availability — the three foundational properties every information-security control protects. Memorize before anything else.", deftr:"Gizlilik, Bütünlük, Kullanılabilirlik — her bilgi güvenliği kontrolünün koruduğu üç temel özellik. Her şeyden önce ezberle.", links:[["netsec/1","NetSec L1"],["compliance/1","Compliance L1"]]},
  {term:"Kill Chain", tr:"Kill Chain", cat:"Cybersec", def:"Lockheed Martin's 7-stage attack model: Recon → Weaponize → Deliver → Exploit → Install → C2 → Action. Mental map for both red & blue teams.", deftr:"Lockheed Martin'in 7 aşamalı saldırı modeli: Keşif → Silahlandırma → İletme → Sömürme → Kurma → C2 → Eylem. Kırmızı ve mavi takımlar için zihinsel harita.", links:[["forensics/1","Forensics L1"]]},
  {term:"CVE", tr:"CVE", cat:"Cybersec", def:"Common Vulnerabilities and Exposures — global ID system for publicly known security flaws (e.g. CVE-2024-3094 = xz backdoor). Maintained by MITRE.", deftr:"Ortak Güvenlik Açıkları ve Maruziyetler — genel olarak bilinen güvenlik kusurları için küresel ID sistemi (örn CVE-2024-3094 = xz arka kapısı). MITRE tarafından bakılır.", links:[["netsec/4","NetSec L4"]]},
  {term:"CVSS", tr:"CVSS", cat:"Cybersec", def:"Common Vulnerability Scoring System (v4) — 0-10 severity score for a CVE. Combines attack vector, complexity, privileges, user interaction, impact (CIA).", deftr:"Ortak Güvenlik Açığı Puanlama Sistemi (v4) — CVE için 0-10 şiddet puanı. Saldırı vektörü, karmaşıklık, ayrıcalıklar, kullanıcı etkileşimi, etki (CIA) birleştirir.", links:[["netsec/4","NetSec L4"]]},
  {term:"NIST CSF", tr:"NIST CSF", cat:"Cybersec", def:"NIST Cybersecurity Framework v2.0 — six functions (Govern, Identify, Protect, Detect, Respond, Recover) for organizing security operations. Industry baseline.", deftr:"NIST Siber Güvenlik Çerçevesi v2.0 — güvenlik operasyonlarını organize etmek için altı işlev (Yönet, Tanı, Koru, Tespit, Yanıt, Kurtar). Endüstri tabanı.", links:[["compliance/3","Compliance L3"]]},

  // ---- R4 additions (May 2026): 18 missing high-priority terms ----
  // -- Generative / CV --
  {term:"VAE", tr:"VAE (Değişimsel Otokodlayıcı)", cat:"CV", def:"Variational Autoencoder — encoder maps input to a distribution over latent z, decoder reconstructs. Trained with reconstruction + KL(q(z|x) ‖ N(0,I)) loss. Foundation of probabilistic generative modeling before diffusion took over.", deftr:"Değişimsel Otokodlayıcı — encoder girdiyi gizli z üzerinde bir dağılıma eşler, decoder yeniden inşa eder. Yeniden yapım + KL(q(z|x) ‖ N(0,I)) kaybı ile eğitilir. Difüzyon devralmadan önce olasılıksal üretici modellemenin temeli.", links:[["deep/10","Deep L10"],["cv/9","CV L9"]]},
  {term:"DDPM", tr:"DDPM (Difüzyon)", cat:"CV", def:"Denoising Diffusion Probabilistic Models (Ho et al 2020) — the seminal diffusion paper. Forward process gradually adds Gaussian noise; reverse process learns to denoise step by step. Foundation of Stable Diffusion, DALL-E 2.", deftr:"Gürültü Giderici Difüzyon Olasılıksal Modeller (Ho ve diğ. 2020) — temel difüzyon makalesi. İleri süreç kademeli olarak Gauss gürültüsü ekler; ters süreç adım adım gürültü gidermeyi öğrenir. Stable Diffusion, DALL-E 2'nin temeli.", links:[["cv/9","CV L9"],["deep/10","Deep L10"],["privacy/7","Privacy L7"]]},
  {term:"Latent Diffusion", tr:"Latent Difüzyon", cat:"CV", def:"Diffusion in compressed VAE latent space instead of pixel space (Rombach et al 2022). Made Stable Diffusion practical — 64×64 latents vs 512×512 pixels = 64× compute reduction.", deftr:"Piksel uzayı yerine sıkıştırılmış VAE gizli uzayında difüzyon (Rombach ve diğ. 2022). Stable Diffusion'ı pratik kıldı — 512×512 piksel yerine 64×64 gizli vektör = 64× hesap azalması.", links:[["cv/9","CV L9"],["multimodal/7","Multimodal L7"]]},
  {term:"Sora", tr:"Sora", cat:"CV", def:"OpenAI's Feb 2024 text-to-video diffusion model. Generates up to 60 second 1080p clips with strong temporal consistency. Uses DiT (Diffusion Transformer) on spacetime patches.", deftr:"OpenAI'nin Şubat 2024 metin-video difüzyon modeli. 60 saniyeye kadar 1080p klip üretir, güçlü zamansal tutarlılıkla. Uzay-zaman yamalarında DiT (Diffusion Transformer) kullanır.", links:[["multimodal/7","Multimodal L7"],["cv/9","CV L9"]]},

  // -- ML Metrics --
  {term:"Accuracy", tr:"Doğruluk", cat:"ML", def:"(TP + TN) / Total — fraction of correct predictions. Simplest metric; misleading on imbalanced data (predicting 'no fraud' on 99% non-fraud gets 99% accuracy).", deftr:"(TP + TN) / Toplam — doğru tahmin oranı. En basit metrik; dengesiz veride yanıltıcıdır (%99 sahte olmayan veride 'sahte değil' demek %99 doğruluk verir).", links:[["ml-theory/9","ML Theory L9"],["sklearn/7","sklearn L7"]]},

  // -- RL --
  {term:"Reward Model", tr:"Ödül Modeli", cat:"RL", def:"In RLHF, a neural network trained on human preference pairs (chosen vs rejected response). Maps (prompt, response) → scalar score. Drives PPO update of the policy LLM.", deftr:"RLHF'de insan tercih çiftleri (seçilen vs reddedilen yanıt) üzerinde eğitilen sinir ağı. (Prompt, yanıt) → skaler puana eşler. Politika LLM'inin PPO güncellemesini sürer.", links:[["rl/10","RL L10"]]},
  {term:"Policy Gradient", tr:"Politika Gradyanı", cat:"RL", def:"Family of RL methods that directly optimize policy parameters via ∇θ E[R] = E[∇θ log π(a|s) · A]. Foundation of REINFORCE, A2C, PPO. Works for continuous action spaces unlike Q-learning.", deftr:"Politika parametrelerini ∇θ E[R] = E[∇θ log π(a|s) · A] ile doğrudan optimize eden RL yöntemleri ailesi. REINFORCE, A2C, PPO'nun temeli. Q-öğrenme'nin aksine sürekli eylem uzaylarında çalışır.", links:[["rl/9","RL L9"]]},
  {term:"A2C / A3C", tr:"A2C / A3C", cat:"RL", def:"Advantage Actor-Critic / Asynchronous Advantage Actor-Critic (Mnih et al 2016). Actor outputs policy π(a|s); critic estimates V(s); update uses advantage A = Q − V. A3C runs many workers in parallel.", deftr:"Advantage Actor-Critic / Asenkron Advantage Actor-Critic (Mnih ve diğ. 2016). Actor π(a|s) politikasını çıkarır; critic V(s)'yi tahmin eder; güncelleme A = Q − V avantajını kullanır. A3C birçok worker'ı paralel çalıştırır.", links:[["rl/9","RL L9"]]},

  // -- Compliance / Regulations --
  {term:"GDPR", tr:"GDPR (Genel Veri Koruma Tüzüğü)", cat:"Compliance", def:"General Data Protection Regulation (EU 2016/679). Extraterritorial law affecting any service touching EU residents. Fines up to 4% of global annual revenue or €20M. Articles 22 (automated decisions), 25 (data protection by design) bite AI directly.", deftr:"Genel Veri Koruma Tüzüğü (AB 2016/679). AB sakinlerine dokunan herhangi bir hizmeti etkileyen ülke-dışı yasa. Küresel yıllık cironun %4'üne veya 20 milyon avroya kadar ceza. Madde 22 (otomatik kararlar), 25 (tasarım yoluyla veri koruma) AI'yı doğrudan ısırır.", links:[["compliance/1","Compliance L1"]]},
  {term:"AI Act", tr:"AI Yasası (AB)", cat:"Compliance", def:"EU Artificial Intelligence Act (2024/1689) — world's first horizontal AI regulation. Risk-based tiers: unacceptable (banned), high (strict obligations: Article 8-15), limited (transparency), minimal. Affects any AI sold into the EU.", deftr:"AB Yapay Zeka Yasası (2024/1689) — dünyanın ilk yatay AI düzenlemesi. Risk-tabanlı düzeyler: kabul edilemez (yasak), yüksek (sıkı yükümlülükler: Madde 8-15), sınırlı (şeffaflık), minimal. AB'ye satılan herhangi bir AI'yı etkiler.", links:[["compliance/2","Compliance L2"]]},
  {term:"NIS2", tr:"NIS2", cat:"Compliance", def:"EU Network and Information Security Directive 2 (2022/2555) — successor to NIS. Expands scope to 'essential' and 'important' entities (energy, transport, health, digital). 24h incident notification, board accountability.", deftr:"AB Ağ ve Bilgi Güvenliği Direktifi 2 (2022/2555) — NIS'in halefi. Kapsamı 'temel' ve 'önemli' kuruluşlara (enerji, ulaşım, sağlık, dijital) genişletir. 24 saatte olay bildirimi, kurul hesap verebilirliği.", links:[["compliance/4","Compliance L4"]]},
  {term:"DORA", tr:"DORA", cat:"Compliance", def:"Digital Operational Resilience Act (EU 2022/2554) — applies to financial entities. Mandates ICT risk management, third-party oversight, incident reporting, resilience testing. In force Jan 2025.", deftr:"Dijital Operasyonel Dayanıklılık Yasası (AB 2022/2554) — finansal kuruluşlara uygulanır. BİT risk yönetimi, üçüncü taraf gözetimi, olay raporlaması, dayanıklılık testi zorunlu kılar. Ocak 2025'te yürürlükte.", links:[["compliance/5","Compliance L5"]]},
  {term:"ISO 27001", tr:"ISO 27001", cat:"Compliance", def:"International standard for Information Security Management Systems (ISMS). Certifiable. 93 controls in Annex A across organizational, people, physical, technological domains. The baseline for enterprise security audits.", deftr:"Bilgi Güvenliği Yönetim Sistemleri (BGYS) için uluslararası standart. Sertifikalanabilir. Annex A'da örgütsel, insan, fiziksel, teknolojik alanlarda 93 kontrol. Kurumsal güvenlik denetimlerinin temeli.", links:[["compliance/6","Compliance L6"]]},

  // -- DL training --
  {term:"Gradient Clipping", tr:"Gradyan Kırpma", cat:"DL", def:"Cap the L2 norm of gradients to a max value (e.g. 1.0) before each optimizer step. Prevents exploding gradients in RNNs, transformers. <code>torch.nn.utils.clip_grad_norm_</code>.", deftr:"Her optimizer adımından önce gradyanların L2 normunu bir maksimum değere (örn. 1.0) sınırla. RNN'lerde, transformer'larda patlayan gradyanı önler. <code>torch.nn.utils.clip_grad_norm_</code>.", links:[["pytorch/4","PyTorch L4"],["deep/8","Deep L8"]]},
  {term:"LR Schedule", tr:"Öğrenme Oranı Programı", cat:"DL", def:"Strategy for varying learning rate over training. Common: cosine decay, warmup + cosine, step decay, OneCycle. Critical for transformer training stability.", deftr:"Eğitim boyunca öğrenme oranını değiştirme stratejisi. Yaygın: kosinüs azalma, ısıtma + kosinüs, adım azalma, OneCycle. Transformer eğitim kararlılığı için kritik.", links:[["pytorch/4","PyTorch L4"]]},
  {term:"Variational Inference", tr:"Değişimsel Çıkarım", cat:"Math", def:"Approximate intractable posterior p(z|x) with a simpler q(z) by minimizing KL(q ‖ p). Foundation of VAEs and probabilistic graphical models. Trades exactness for tractability.", deftr:"Hesaplanamaz arka olasılık p(z|x)'i daha basit bir q(z) ile KL(q ‖ p)'yi minimize ederek yaklaştır. VAE'lerin ve olasılıksal grafik modellerin temeli. Hesaplanabilirlik için kesinliği takas eder.", links:[["math/4","Math L4"],["deep/10","Deep L10"]]},
  {term:"GELU / SiLU", tr:"GELU / SiLU", cat:"DL", def:"Smooth activation functions replacing ReLU in modern transformers. GELU (Hendrycks 2016) ≈ x · Φ(x) — used in BERT, GPT. SiLU/Swish (Ramachandran 2017) = x · σ(x) — used in Llama, MobileNet v3.", deftr:"Modern transformer'larda ReLU'nun yerini alan pürüzsüz aktivasyon fonksiyonları. GELU (Hendrycks 2016) ≈ x · Φ(x) — BERT, GPT'de kullanılır. SiLU/Swish (Ramachandran 2017) = x · σ(x) — Llama, MobileNet v3'te kullanılır.", links:[["deep/3","Deep L3"],["pytorch/9","PyTorch L9"]]},
  {term:"Contrastive Loss", tr:"Karşıtsal Kayıp", cat:"DL", def:"Loss that pulls similar pairs (positive) together and pushes different pairs (negative) apart in embedding space. Backbone of CLIP, SimCLR, sentence-transformers.", deftr:"Embedding uzayında benzer çiftleri (pozitif) birbirine çeken ve farklı çiftleri (negatif) iten kayıp. CLIP, SimCLR, sentence-transformers'ın belkemiği.", links:[["cv/10","CV L10"],["nlp/5","NLP L5"]]},
];

const CATS = [...new Set(TERMS.map(t => t.cat))];
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const filtersEl = document.getElementById('filters');
const countEl = document.getElementById('count');

let activeCats = new Set();
let q = '';

function chip(label, isAll) {
  const c = document.createElement('span');
  c.className = 'glo-chip' + (isAll && !activeCats.size ? ' active' : '') + (!isAll && activeCats.has(label) ? ' active' : '');
  c.textContent = label;
  c.onclick = () => {
    if (isAll) { activeCats.clear(); }
    else if (activeCats.has(label)) { activeCats.delete(label); }
    else { activeCats.add(label); }
    renderFilters();
    render();
  };
  return c;
}

function renderFilters() {
  filtersEl.innerHTML = '';
  filtersEl.appendChild(chip('All', true));
  CATS.forEach(c => filtersEl.appendChild(chip(c, false)));
}

function render() {
  const lang = document.documentElement.lang === 'tr' ? 'tr' : 'en';
  const ql = q.trim().toLowerCase();
  const filtered = TERMS.filter(t => {
    if (activeCats.size && !activeCats.has(t.cat)) return false;
    if (!ql) return true;
    const hay = (t.term + ' ' + t.tr + ' ' + t.def + ' ' + t.deftr).toLowerCase();
    return hay.includes(ql);
  }).sort((a, b) => a.term.localeCompare(b.term));

  countEl.textContent = `${filtered.length} / ${TERMS.length} ${lang === 'tr' ? 'terim' : 'terms'}`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="glo-empty">${lang === 'tr' ? 'Sonuç yok' : 'No results'}</div>`;
    return;
  }
  grid.innerHTML = filtered.map(t => `
    <div class="glo-card">
      <div class="glo-term">
        <h3>${t.term}</h3>
        ${t.tr !== t.term ? `<span class="tr">${t.tr}</span>` : ''}
        <span class="glo-cat">${t.cat}</span>
      </div>
      <div class="glo-def">${lang === 'tr' ? t.deftr : t.def}</div>
      ${lang === 'en' && t.deftr !== t.def ? `<div class="glo-def-tr">${t.deftr}</div>` : ''}
      <div class="glo-links">${t.links.map(([url, label]) => `<a href="/tutorials/${url}">${label}</a>`).join(' ')}</div>
    </div>
  `).join('');
}

search.addEventListener('input', () => { q = search.value; render(); });
renderFilters();
render();

// Hook language toggle
document.getElementById('langTog')?.addEventListener('click', () => {
  setTimeout(render, 100);
});

// Theme toggle (lightweight reuse)
document.getElementById('themeTog')?.addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
});

// Lang toggle
const langBtn = document.getElementById('langTog');
const langLbl = document.getElementById('langLabel');
let lang = localStorage.getItem('site-lang') || 'en';
function applyLang() {
  document.documentElement.lang = lang;
  langLbl.textContent = lang === 'tr' ? 'TR' : 'EN';
  document.querySelectorAll('[data-lang-en]').forEach(el => el.style.display = lang === 'en' ? '' : 'none');
  document.querySelectorAll('[data-lang-tr]').forEach(el => el.style.display = lang === 'tr' ? '' : 'none');
  search.placeholder = lang === 'tr' ? 'Ara…' : 'Search…';
  render();
}
applyLang();
langBtn?.addEventListener('click', () => {
  lang = lang === 'tr' ? 'en' : 'tr';
  localStorage.setItem('site-lang', lang);
  applyLang();
});
</script>
</body>
</html>
